        playerKey:
          type: string
          example: 465.p.6743
        playerId:
          type: integer
          format: int32
          description: "The player id inside the player key, the id the player read\
            \ model and the draft's picks use."
          example: 6743
        selectedPosition:
          type: string
          description: "The slot the manager has him in today (C, LW, D, G, Util,\
            \ BN, IR, IR+, NA, …); absent when Yahoo does not say."
          example: BN
        fullName:
          type: string
          description: His full name; absent when Yahoo does not say.
          example: Connor McDavid
        teamAbbrev:
          type: string
          description: "The NHL club Yahoo has him on, in Yahoo's own abbreviation."
          example: EDM
        uniformNumber:
          type: integer
          format: int32
        goalie:
          type: boolean
          description: True for a goalie (Yahoo's position type G).
        eligiblePositions:
          type: array
          description: Every position he may be started at in this league; empty when
