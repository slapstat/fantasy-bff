openapi: 3.1.0
info:
  title: Fantasy Yahoo Service API
  description: "Integrates with the Yahoo Fantasy Sports API: owns the per-user OAuth\
    \ 2.0 flow and exposes a user's fantasy league settings to the BFF."
  version: v1
servers:
- url: /
tags:
- name: Yahoo Players
  description: League-wide Yahoo player list with fantasy eligible positions (uses
    the app-owned service account)
- name: Players
  description: "Cached player read model: the pool as it is now, with a chosen season's\
    \ stats"
- name: Yahoo OAuth
  description: Per-user Yahoo account connection flow
- name: Sync
  description: Refresh the cached player read model from Yahoo
- name: Yahoo Leagues
  description: A user's Yahoo fantasy leagues and their settings
paths:
  /api/v1/yahoo/oauth/complete:
    post:
      tags:
      - Yahoo OAuth
      summary: Claim a parked Yahoo connection
      description: "Attaches the tokens parked by the callback to appUserId, if that\
        \ user started the flow. The code is single-use and short-lived; a code presented\
        \ for a different user is rejected and its tokens discarded."
      operationId: complete
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteLinkRequest"
        required: true
      responses:
        "200":
          description: Yahoo account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: "Link code unknown, already used or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: Link code belongs to a flow another user started; discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/yahoo/oauth/authorize-url:
    post:
      tags:
      - Yahoo OAuth
      summary: Build the Yahoo authorization URL
      description: Returns the Yahoo consent URL (with a signed state) the browser
        should be sent to.
      operationId: authorizeUrl
      parameters:
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Authorization URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeUrlResponse"
  /api/v1/sync:
    post:
      tags:
      - Sync
      summary: Trigger a player sync
      description: Refreshes the cached player read model from Yahoo. Runs asynchronously.
      operationId: triggerSync
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
        "409":
          description: A sync is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
  /api/v1/yahoo/players:
    get:
      tags:
      - Yahoo Players
      summary: List every Yahoo player for a game with eligible positions and season
        stats
      description: "Paginates the Yahoo game player collection using the service account\
        \ token, returning each player's identity, headshot, eligible positions and\
        \ the requested season's stat line. Defaults to the NHL game; a blank season\
        \ means the current season."
      operationId: players
      parameters:
      - name: gameKey
        in: query
        required: false
        schema:
          type: string
          default: nhl
      - name: season
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Players returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YahooPlayerResponse"
        "404":
          description: The Yahoo service account is not connected
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YahooPlayerResponse"
  /api/v1/yahoo/oauth/connection:
    get:
      tags:
      - Yahoo OAuth
      summary: Yahoo connection status
      description: Whether the given user has a connected Yahoo account.
      operationId: connection
      parameters:
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Connection status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
  /api/v1/yahoo/oauth/callback:
    get:
      tags:
      - Yahoo OAuth
      summary: Yahoo OAuth callback
      description: "Yahoo redirects the browser here after consent. Exchanges the\
        \ code for tokens and parks them under a one-time link code, then redirects\
        \ back to the web app with ?yahoo=confirm&account=user|service and the code\
        \ in the fragment (#link=…), where the signed-in user claims them through\
        \ /complete. Public (validated by the signed state), so it is exempt from\
        \ the internal API-key filter."
      operationId: callback
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Redirect back to the web app
  /api/v1/yahoo/leagues:
    get:
      tags:
      - Yahoo Leagues
      summary: List the user's NHL fantasy leagues
      operationId: leagues
      parameters:
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Leagues returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
        "403":
          description: Yahoo refused the request; the message carries Yahoo's own
            wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/yahoo/leagues/{leagueKey}/settings:
    get:
      tags:
      - Yahoo Leagues
      summary: Get a league's scoring + roster settings
      operationId: settings
      parameters:
      - name: leagueKey
        in: path
        required: true
        schema:
          type: string
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Settings returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSettingsResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSettingsResponse"
        "403":
          description: Yahoo refused the request; the message carries Yahoo's own
            wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/yahoo/leagues/{leagueKey}/rosters:
    get:
      tags:
      - Yahoo Leagues
      summary: List a league's teams with the players each holds now
      description: "Each team's current roster, after trades, drops and pickups, bench\
        \ and injured reserve included. Player ids are the ids the draft's picks and\
        \ the player read model use. With a date, each roster is the lineup as set\
        \ for that day: Yahoo keeps one per day, so a player's selectedPosition is\
        \ his slot on that date, and a future day shows what the manager has set for\
        \ it so far. This is what a start/bench view of a chosen day reads."
      operationId: rosters
      parameters:
      - name: leagueKey
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
          minLength: 0
      - name: date
        in: query
        description: "The day whose lineup to read, as YYYY-MM-DD; today's roster\
          \ when absent"
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Rosters returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueRostersResponse"
        "400":
          description: "The league key or user id is blank or too long, or the date\
            \ is not YYYY-MM-DD"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: Yahoo refused the request; the message carries Yahoo's own
            wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/yahoo/leagues/{leagueKey}/free-agents:
    get:
      tags:
      - Yahoo Leagues
      summary: List the players the league has available
      description: "Free agents and players on waivers, in Yahoo's actual-rank order,\
        \ so the first rows are the best available, optionally only those eligible\
        \ at one position. Read with the user's own Yahoo token."
      operationId: freeAgents
      parameters:
      - name: leagueKey
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
          minLength: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 150
          maximum: 300
          minimum: 1
      - name: position
        in: query
        description: Only the players eligible at this position; all positions when
          absent
        required: false
        schema:
          type: string
          pattern: ^(C|LW|RW|D|G)$
      - name: waiversOnly
        in: query
        description: Only the players on waivers; free agents and waivers together
          when absent or false
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Available players returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YahooAvailablePlayerResponse"
        "400":
          description: "The limit is outside 1-300 or the position is not one of C,\
            \ LW, RW, D, G"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YahooAvailablePlayerResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YahooAvailablePlayerResponse"
        "403":
          description: Yahoo refused the request; the message carries Yahoo's own
            wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/yahoo/leagues/{leagueKey}/draft:
    get:
      tags:
      - Yahoo Leagues
      summary: "Get a league's draft: status, teams in draft order, and the picks\
        \ made so far"
      operationId: draft
      parameters:
      - name: leagueKey
        in: path
        required: true
        schema:
          type: string
      - name: appUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Draft returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueDraftResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueDraftResponse"
        "403":
          description: Yahoo refused the request; the message carries Yahoo's own
            wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/sync/runs:
    get:
      tags:
      - Sync
      summary: Recent sync runs
      description: Outcome (counts) and the diff (players added/removed) of the most
        recent syncs.
      operationId: runs
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: Runs returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncRunResponse"
  /api/v1/sync/probe:
    get:
      tags:
      - Sync
      summary: Ask Yahoo whether the service account may read a game's players
      description: "Makes one live call and reports the status Yahoo answered with,\
        \ including its own error wording. Reads nothing into the cache and writes\
        \ nothing, so it is safe to fire at any game key or season. Vary one input\
        \ at a time to tell a refused season from a refused game from a dead token.\
        \ Give a leagueKey to ask a league's player collection instead of the whole\
        \ game's — the granted scope is about leagues, so that one may be allowed\
        \ where the other is not."
      operationId: probe
      parameters:
      - name: gameKey
        in: query
        required: false
        schema:
          type: string
          default: nhl
      - name: season
        in: query
        required: false
        schema:
          type: string
      - name: leagueKey
        in: query
        required: false
        schema:
          type: string
      - name: target
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "What Yahoo answered, refusal included"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooProbeResponse"
  /api/v1/sync/probe/league:
    get:
      tags:
      - Sync
      summary: Read one of a league's resources raw
      description: "What Yahoo sends for a league's settings, teams, draftresults,\
        \ or the three together (draft), verbatim. Read with the service account's\
        \ token, so only a league that account belongs to answers — or, with an appUserId,\
        \ with that user's own token, which is the only way to read a real league\
        \ the service account is not in. For checking which fields Yahoo really fills\
        \ before code relies on them."
      operationId: probeLeague
      parameters:
      - name: leagueKey
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - name: resource
        in: query
        required: true
        schema:
          type: string
          maxLength: 32
          minLength: 0
      - name: appUserId
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 0
      responses:
        "200":
          description: "What Yahoo answered, refusal included"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooLeagueProbeResponse"
  /api/v1/sync/leagues:
    get:
      tags:
      - Sync
      summary: The service account's own leagues
      description: "The leagues the app-owned Yahoo account belongs to, with their\
        \ keys. Two uses: it hands you a league key for the probe without hunting\
        \ for one, and it is itself a test — if this succeeds while a game's player\
        \ collection is refused, the account and its permission are fine and the refusal\
        \ is about what was asked for, not who asked."
      operationId: serviceAccountLeagues
      responses:
        "200":
          description: Leagues returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
        "403":
          description: Yahoo refused the request; the message carries Yahoo's own
            wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/players/{playerId}/headshot:
    get:
      tags:
      - Players
      summary: A player's headshot thumbnail
      description: "The player's headshot, scaled to 288px tall and otherwise as Yahoo\
        \ frames it — the caller crops it to the avatar it draws. Refreshed by the\
        \ sync, so the response is safe to cache for a long time and is revalidated\
        \ with an ETag."
      operationId: headshot
      parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Thumbnail returned
          content:
            image/png:
              schema:
                type: string
                format: byte
        "404":
          description: No headshot stored for this player
          content:
            image/png:
              schema:
                type: string
                format: byte
  /api/v1/players/skaters:
    get:
      tags:
      - Players
      summary: Skaters with eligible positions and a season's stats
      description: "The whole pool, or its highest scoring when `limit` is given."
      operationId: skaters
      parameters:
      - name: season
        in: query
        description: "Season start year — 2025 is the 2025-26 season. Required: the\
          \ season being collected and the season a caller wants to show are deliberately\
          \ different for most of the year, so there is no sensible default. A player\
          \ with no line for it comes back with no stats rather than being left out."
        required: true
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: "How many to return, highest scoring first (most wins, for goalies).\
          \ Absent returns the whole pool in name order, which is what a caller ranking\
          \ every player wants; a caller drawing a handful of rows should ask for\
          \ a handful."
        required: false
        schema:
          type: integer
          format: int32
          maximum: 500
          minimum: 1
      responses:
        "200":
          description: Skaters returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkaterResponse"
        "400":
          description: limit is not between 1 and 500
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkaterResponse"
  /api/v1/players/goalies:
    get:
      tags:
      - Players
      summary: Goalies with eligible positions and a season's stats
      description: "The whole pool, or its winningest when `limit` is given."
      operationId: goalies
      parameters:
      - name: season
        in: query
        description: "Season start year — 2025 is the 2025-26 season. Required: the\
          \ season being collected and the season a caller wants to show are deliberately\
          \ different for most of the year, so there is no sensible default. A player\
          \ with no line for it comes back with no stats rather than being left out."
        required: true
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: "How many to return, highest scoring first (most wins, for goalies).\
          \ Absent returns the whole pool in name order, which is what a caller ranking\
          \ every player wants; a caller drawing a handful of rows should ask for\
          \ a handful."
        required: false
        schema:
          type: integer
          format: int32
          maximum: 500
          minimum: 1
      responses:
        "200":
          description: Goalies returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalieResponse"
        "400":
          description: limit is not between 1 and 500
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalieResponse"
components:
  schemas:
    CompleteLinkRequest:
      type: object
      properties:
        appUserId:
          type: string
          description: "The app user claiming the connection: the signed-in user,\
            \ or the service account."
          maxLength: 64
          minLength: 0
        code:
          type: string
          description: The one-time link code the OAuth callback handed to the browser.
          maxLength: 128
          minLength: 0
      required:
      - appUserId
      - code
    ErrorDto:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
    ConnectionResponse:
      type: object
      properties:
        connected:
          type: boolean
          description: Whether the user has a connected Yahoo account.
      required:
      - connected
    AuthorizeUrlResponse:
      type: object
      properties:
        authorizeUrl:
          type: string
          description: The Yahoo consent URL the browser should be redirected to.
      required:
      - authorizeUrl
    SyncAcceptedResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    YahooGoalieStats:
      type: object
      properties:
        gamesPlayed:
          type: integer
          format: int32
        gamesStarted:
          type: integer
          format: int32
        wins:
          type: integer
          format: int32
        losses:
          type: integer
          format: int32
        shutouts:
          type: integer
          format: int32
        shotsAgainst:
          type: integer
          format: int32
        saves:
          type: integer
          format: int32
        goalsAgainst:
          type: integer
          format: int32
        goalsAgainstAvg:
          type: number
          format: double
          description: Goals against average
        savePct:
          type: number
          format: double
          description: Save percentage as a fraction (e.g. 0.911)
    YahooPlayerResponse:
      type: object
      properties:
        yahooId:
          type: string
          description: Yahoo's player id
        fullName:
          type: string
          description: Player full name
        firstName:
          type: string
          description: Player first name
        lastName:
          type: string
          description: Player last name
        teamAbbrev:
          type: string
          description: Yahoo's editorial team abbreviation
        position:
          type: string
          description: "Primary position (single, e.g. \"C\")"
        uniformNumber:
          type: integer
          format: int32
          description: Uniform / sweater number
        imageUrl:
          type: string
          description: Full-resolution headshot image URL
        goalie:
          type: boolean
          description: Whether the player is a goalie
        eligiblePositions:
          type: array
          description: "Yahoo fantasy eligible positions (e.g. [\"C\",\"LW\"])"
          items:
            type: string
        skaterStats:
          $ref: "#/components/schemas/YahooSkaterStats"
          description: Season skater stat line; null for goalies
        goalieStats:
          $ref: "#/components/schemas/YahooGoalieStats"
          description: Season goalie stat line; null for skaters
      required:
      - eligiblePositions
      - firstName
      - fullName
      - goalie
      - lastName
      - yahooId
    YahooSkaterStats:
      type: object
      properties:
        gamesPlayed:
          type: integer
          format: int32
        goals:
          type: integer
          format: int32
        assists:
          type: integer
          format: int32
        points:
          type: integer
          format: int32
        plusMinus:
          type: integer
          format: int32
        pim:
          type: integer
          format: int32
        powerPlayGoals:
          type: integer
          format: int32
        powerPlayPoints:
          type: integer
          format: int32
        shorthandedGoals:
          type: integer
          format: int32
        shorthandedPoints:
          type: integer
          format: int32
        gameWinningGoals:
          type: integer
          format: int32
        shotsOnGoal:
          type: integer
          format: int32
        shootingPct:
          type: number
          format: double
          description: Shooting percentage as a fraction (e.g. 0.151)
        faceoffsWon:
          type: integer
          format: int32
        faceoffsLost:
          type: integer
          format: int32
        hits:
          type: integer
          format: int32
        blocks:
          type: integer
          format: int32
        avgTimeOnIce:
          type: string
          description: "Average time on ice per game, formatted \"MM:SS\""
    LeagueSummary:
      type: object
      properties:
        leagueKey:
          type: string
        name:
          type: string
        season:
          type: integer
          format: int32
        numTeams:
          type: integer
          format: int32
        scoringType:
          type: string
      required:
      - leagueKey
      - name
    LeaguesResponse:
      type: object
      properties:
        leagues:
          type: array
          items:
            $ref: "#/components/schemas/LeagueSummary"
      required:
      - leagues
    LeagueSettingsResponse:
      type: object
      properties:
        leagueKey:
          type: string
        name:
          type: string
        scoringType:
          type: string
        statCategories:
          type: array
          items:
            $ref: "#/components/schemas/StatCategory"
        rosterPositions:
          type: array
          items:
            $ref: "#/components/schemas/RosterSlot"
        maxWeeklyAdds:
          type: integer
          format: int32
          description: "How many players a team may add in one fantasy week (Yahoo's\
            \ max_weekly_adds, \"Max Acquisitions per Week\"). Null when the league\
            \ sets no maximum: Yahoo then leaves the field out."
          minimum: 1
      required:
      - leagueKey
      - name
      - rosterPositions
      - scoringType
      - statCategories
    RosterSlot:
      type: object
      properties:
        position:
          type: string
        count:
          type: integer
          format: int32
        positionType:
          type: string
      required:
      - count
      - position
    StatCategory:
      type: object
      properties:
        statId:
          type: integer
          format: int32
        name:
          type: string
        displayName:
          type: string
        positionType:
          type: string
        displayOnly:
          type: boolean
