      - round
      - teamKey
    LeagueDraftResponse:
      type: object
      properties:
        leagueKey:
          type: string
        status:
          type: string
          enum:
          - PRE_DRAFT
          - IN_PROGRESS
          - FINISHED
          - UNKNOWN
        auction:
          type: boolean
          description: "True for an auction draft, whose picks are bought rather than\
            \ taken in turn."
        teams:
          type: array
          description: "The league's teams in first-round draft order once Yahoo has\
            \ set it, otherwise in Yahoo's team order; `orderKnown` says which."
          items:
            $ref: "#/components/schemas/LeagueDraftTeam"
        orderKnown:
          type: boolean
          description: "True when `teams` is the draft order, each team placed by\
            \ a first-round slot of its own. False before Yahoo lists those slots\
            \ (for a live draft, until it runs) or while a team holds none: a team's\
            \ place in the list then says nothing about when it picks, so no seat\
            \ may be read from it."
        picks:
          type: array
          description: "Every pick Yahoo lists, by overall pick number. Before the\
            \ draft this can hold the order's slots without players, or nothing at\
            \ all."
          items:
            $ref: "#/components/schemas/LeagueDraftPick"
      required:
      - auction
      - leagueKey
      - orderKnown
      - picks
      - status
      - teams
    LeagueDraftTeam:
