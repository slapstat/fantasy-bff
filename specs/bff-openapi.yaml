        matched:
          type: integer
          format: int32
          description: Players on the from side that found a counterpart on the to
            side
        matchedOnName:
          type: integer
          format: int32
          description: Matched on the full name
        matchedOnFallback:
          type: integer
          format: int32
          description: "Matched on last name plus first initial, where that form was\
            \ unique on both sides"
        unmatched:
          type: integer
          format: int32
        coverage:
          type: number
          format: double
          description: "Share of the whole Yahoo pool that found a counterpart. Read\
