      summary: Total an ESPN league's teams against a projection
      description: "Reads the league's rosters and scoring settings from ESPN, with\
        \ the user's stored cookies where the league is private, and totals every\
        \ team's current roster the way a Yahoo league's is totalled; while the draft\
        \ runs a roster is the team's picks so far. As with a Yahoo league, the teams,\
