          maxLength: 20
          minLength: 0
      - name: source
        in: query
        description: Which projection to score the players against; the model by default
        required: false
        schema:
          type: string
          maxLength: 32
          minLength: 0
      - name: projectionId
        in: query
        description: "The board to score the players against, one of the user's own\
          \ or one they follow. Implies `source=projection`, which needs it."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "The league's teams, totalled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSummaryResponse"
        "400":
          description: "Unknown source, a source and a board that do not go together,\
