          type: array
          description: "Yahoo players with no ESPN counterpart, busiest first and\
            \ with the games they played, at most 50 of them. A platform only lists\
            \ players with fantasy relevance, so a long tail of 0 GP here is expected;\
            \ anyone with a real season is how a broken match is noticed."
          items:
