            \ got into a game and are simply not on the new platform's active list."
        playersWithGames:
          type: integer
          format: int32
          description: Yahoo players who played at least one game in the reference
            season
        matchedWithGames:
          type: integer
          format: int32
          description: How many of those found an ESPN counterpart
        coverageOfPlayersWithGames:
          type: number
          format: double
