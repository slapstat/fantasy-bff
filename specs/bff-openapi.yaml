openapi: 3.1.0
info:
  title: Fantasy Hockey BFF API
  description: Backend for Frontend aggregation layer for the Fantasy Hockey application
  version: "1.0"
servers:
- url: /
security:
- bearerAuth: []
tags:
- name: Streamer planner
  description: Team schedules rated for streaming
- name: Shared projections
  description: "Public, read-only projections (no sign-in required)"
- name: Projection shares
  description: The current user's public links to their projections
- name: Yahoo
  description: The authenticated user's Yahoo fantasy account and leagues
- name: Player scout
  description: "How the model's view of every player in a league has moved, and why"
- name: Players
  description: "NHL player stats endpoints (public, read-only)"
- name: Role changes
  description: Skaters whose role at their club just changed
- name: Features
  description: Which features this environment serves
- name: Projection model
  description: "Model-generated projection lines, and measured totals over a range\
    \ of games. Data © MoneyPuck.com, used under its non-commercial terms."
- name: Leagues
  description: What a linked fantasy league holds
- name: Start/Bench
  description: "The user's lineup for a day, with the model's line for each player"
- name: Authentication
  description: Register and login endpoints
- name: Admin
  description: "Admin-only: Yahoo service account + player sync"
- name: Account
  description: The signed-in account's own profile
- name: Draft analysis
  description: "A league's draft, every pick graded against the model"
- name: Projections
  description: The authenticated user's saved player projections
- name: League summaries
  description: Where a league's teams stand
- name: Versions
  description: Deployed version and reachability of every service
- name: Feedback
  description: Bug reports and feature requests from signed-in users
- name: ESPN
  description: The authenticated user's ESPN fantasy leagues
- name: Billing
  description: "Subscription checkout, customer portal and premium entitlements"
paths:
  /api/v1/projections/{id}:
    get:
      tags:
      - Projections
      summary: "Fetch one of the current user's saved projections, including its data"
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Projection found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
    put:
      tags:
      - Projections
      summary: Update one of the current user's saved projections
      description: "On a followed board only `data.draft` is kept: the rest is the\
        \ author's and is rewritten whenever they publish. The request is not refused,\
        \ it is simply taken in part, and the board as stored comes back."
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectionRequest"
        required: true
      responses:
        "200":
          description: Projection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: The name is already taken by another projection or imported
            board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
    delete:
      tags:
      - Projections
      summary: Delete one of the current user's saved projections
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Projection deleted
        "404":
          description: No such projection for this user
  /api/v1/projections/{id}/share:
    get:
      tags:
      - Projection shares
      summary: Fetch the share link for one of the current user's projections
      operationId: getProjectionShare
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The projection is shared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "404":
          description: "No such projection for this user, or it is not shared"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
    put:
      tags:
      - Projection shares
      summary: "Publish the projection's public board, or publish it again"
      description: "An already-shared projection keeps its link and has the board\
        \ behind it replaced, so the link follows the projection. The web publishes\
        \ again after every save of a shared projection. A link cannot be withdrawn\
        \ short of deleting the projection."
      operationId: shareProjection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareProjectionRequest"
        required: true
      responses:
        "200":
          description: "Share created, or the existing one refreshed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "404":
          description: No such projection for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "409":
          description: The account has no username yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
  /api/v1/projections/{id}/name:
    put:
      tags:
      - Projections
      summary: Rename one of the current user's boards or drafts
      description: "Without sending the board with it. A name the user typed is refused\
        \ where it is taken; one the app derived (`derived: true`, a draft taking\
        \ the name of the league it was just synced with) is numbered instead, and\
        \ is skipped altogether where the user has named the row themselves. The saved\
        \ name is in the response either way."
      operationId: rename
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameProjectionRequest"
        required: true
      responses:
        "200":
          description: "Renamed, or left as it was"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionSummaryResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionSummaryResponse"
        "404":
          description: No such projection for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionSummaryResponse"
        "409":
          description: Another row of the user's holds that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionSummaryResponse"
  /api/v1/espn/credentials:
    get:
      tags:
      - ESPN
      summary: Whether the user has stored ESPN cookies (for private leagues)
      operationId: credentialStatus
      responses:
        "200":
          description: Status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialStatusResponse"
    put:
      tags:
      - ESPN
      summary: Store (or replace) the user's ESPN cookies
      operationId: saveCredentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EspnCredentialsRequest"
        required: true
      responses:
        "204":
          description: Cookies stored
        "400":
          description: Missing or invalid cookie values
    delete:
      tags:
      - ESPN
      summary: Delete the user's stored ESPN cookies
      operationId: deleteCredentials
      responses:
        "204":
          description: Cookies deleted (or none existed)
  /api/v1/account/username:
    put:
      tags:
      - Account
      summary: Set the account's public name
      description: "The name shown wherever the account publishes something. Sharing\
        \ a projection requires one, which is the only thing that forces the choice."
      operationId: setUsername
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUsernameRequest"
        required: true
      responses:
        "200":
          description: Username set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: Validation failed (length or characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "409":
          description: Another account already holds that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /api/v1/account/avatar:
    get:
      tags:
      - Account
      summary: Fetch the account's profile picture
      description: "The picture as it was uploaded, served under the type it was checked\
        \ to be. An account without one gets an empty 204 rather than an error: having\
        \ no picture is the normal state of a new account, not a failure."
      operationId: getAvatar
      responses:
        "200":
          description: Picture returned
          content:
            image/*:
              schema:
                type: string
                format: byte
        "204":
          description: The account has no picture
          content:
            image/*:
              schema:
                type: string
                format: byte
    put:
      tags:
      - Account
      summary: Set the account's profile picture
      description: "A PNG, JPEG or WebP of at most 512 KB, sent as the `file` part\
        \ of a multipart form. The app scales the picture down before uploading; what\
        \ arrives here is stored and served as it is. Replaces any picture the account\
        \ had."
      operationId: setAvatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "204":
          description: Picture set
        "400":
          description: "Not a PNG, JPEG or WebP, empty, or larger than 512 KB"
        "413":
          description: The upload exceeds the request size limit
    delete:
      tags:
      - Account
      summary: Remove the account's profile picture
      operationId: removeAvatar
      responses:
        "204":
          description: "Picture removed, or there was none"
  /api/v1/yahoo/connect:
    post:
      tags:
      - Yahoo
      summary: Start connecting the user's Yahoo account
      description: Returns the Yahoo consent URL the web app should redirect the browser
        to.
      operationId: connect
      responses:
        "200":
          description: Authorization URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeUrlResponse"
  /api/v1/yahoo/connect/complete:
    post:
      tags:
      - Yahoo
      summary: Finish connecting the user's Yahoo account
      description: "Attaches the Yahoo authorization from the consent the browser\
        \ just returned from, if this user is the one who started it. The code is\
        \ single-use and expires after five minutes. 404 means it is unknown, used\
        \ or expired; 409 means a different account started this connection, and the\
        \ Yahoo authorization has been discarded."
      operationId: completeConnect
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YahooLinkClaimRequest"
        required: true
      responses:
        "200":
          description: Yahoo account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          description: Malformed code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: "Code unknown, already used or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: Another account started this connection; discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/projections:
    get:
      tags:
      - Projections
      summary: List the current user's saved projections (metadata only)
      operationId: list
      responses:
        "200":
          description: "The user's projections, newest first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectionSummaryResponse"
    post:
      tags:
      - Projections
      summary: Save a new projection for the current user
      description: "Send `source` with an empty `data.players` to have the server\
        \ fill the player rows in from its own read model, instead of uploading ~1600\
        \ players the client just downloaded. Send `data.players` (and no `source`)\
        \ when the rows are user-specific, e.g. copied or carried over from the demo.\
        \ A `name` the account already holds is numbered (\"<name> (2)\") rather than\
        \ refused, so read the saved name back from the response."
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectionRequest"
        required: true
      responses:
        "201":
          description: Projection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "403":
          description: source=model or source=rest_of_season needs premium and this
            account has none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: "A draft against that preset already exists, or a request racing\
            \ this one took the name"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
  /api/v1/projections/{id}/drafts:
    post:
      tags:
      - Projections
      summary: Start a draft against one of the current user's boards
      description: "The draft is a row of its own, holding a copy of the board's numbers\
        \ and its own picks — so the board can be edited or deleted while the draft\
        \ is under way, and a board can be drafted against as many times as its owner\
        \ likes. The rows are copied server-side and are not sent. Without a `name`\
        \ the draft takes the board's, numbered (\"Board (2)\") where another draft\
        \ already holds it."
      operationId: startDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartDraftRequest"
        required: true
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: "Validation failed, or the source is itself a draft"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No such projection for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
  /api/v1/projections/imports:
    post:
      tags:
      - Projections
      summary: Follow a shared board by its link
      description: "Anyone holding a share link may follow the board behind it and\
        \ draft against it. A follow is a live mirror: it is rewritten, name and all,\
        \ every time the author publishes again, and the follower's own draft is the\
        \ only thing on it they may change. Following a link twice does not make a\
        \ second copy — the follow already held comes back, with 200 rather than 201.\
        \ It disappears when the share does. To take a board of your own that the\
        \ author's changes never reach, copy it instead."
      operationId: importFromShare
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportProjectionRequest"
        required: true
      responses:
        "201":
          description: Now following the board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "200":
          description: This link was already followed; that follow is returned untouched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: "Validation failed, or the link is the caller's own board"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No share with that token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: A request racing this one created the follow; list the projections
            again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "412":
          description: '`seenUpdatedAt` was sent and the author has changed the board
            since. Nothing was written.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
  /api/v1/projections/copies:
    post:
      tags:
      - Projections
      summary: Copy a shared board into the current user's own projections
      description: "The copy is the board as it is published now, named after the\
        \ share (\"Copy of <name>\", numbered if that one is taken), with no draft\
        \ and no link back: it is the user's to edit, and nothing the author publishes\
        \ afterwards reaches it. Only the copy is made: it does not follow the link\
        \ and leaves a follow the user already has untouched. To follow a board, call\
        \ `/projections/imports` instead. A board of one's own may be copied."
      operationId: copyFromShare
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyProjectionRequest"
        required: true
      responses:
        "201":
          description: Copy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "404":
          description: No share with that token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "409":
          description: A request racing this one took the name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
        "412":
          description: '`seenUpdatedAt` was sent and the author has changed the board
            since. Nothing was written.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionResponse"
  /api/v1/feedback:
    post:
      tags:
      - Feedback
      summary: Send a bug report or a feature request
      description: "Filed privately, together with the account's email address so\
        \ the answer can go out by mail. Served only where GET /api/v1/features reports\
        \ feedback."
      operationId: sendFeedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFeedbackRequest"
        required: true
      responses:
        "204":
          description: Sent
        "400":
          description: Validation failed
        "404":
          description: This environment does not take feedback
        "502":
          description: "It could not be filed, and nothing was kept"
  /api/v1/billing/portal-session:
    post:
      tags:
      - Billing
      summary: Open the billing management portal
      description: Returns the provider-hosted customer-portal URL for managing or
        cancelling the subscription.
      operationId: portalSession
      responses:
        "200":
          description: Portal URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUrlResponse"
        "404":
          description: The user has no billing customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUrlResponse"
  /api/v1/billing/checkout-session:
    post:
      tags:
      - Billing
      summary: Start a checkout session to subscribe
      description: Returns the provider-hosted checkout URL the web app should redirect
        the browser to. An account that already has a checkout it can still pay gets
        that same one back.
      operationId: checkoutSession
      responses:
        "200":
          description: Checkout URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrlResponse"
        "409":
          description: The account already has a live subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrlResponse"
  /api/v1/auth/verify:
    post:
      tags:
      - Authentication
      summary: Verify an email address with a token
      description: Consumes a single-use verification token from the email link and
        marks the account's email verified.
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "200":
          description: Email verified
        "400":
          description: "Invalid or expired token, or validation error"
  /api/v1/auth/verify/resend:
    post:
      tags:
      - Authentication
      summary: Resend the verification email
      description: "Always returns 200. To avoid revealing whether an account exists,\
        \ the response is identical whether or not a verification email was sent."
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
        required: true
      responses:
        "200":
          description: Request accepted (an email is sent only if a matching unverified
            account exists)
        "400":
          description: Validation error
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      description: Create a new user account and return an authenticated session
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: User registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Email already in use or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh tokens
      description: "Exchange a valid refresh token for a new access token; the rotated\
        \ refresh token comes back only in the HttpOnly slapstat_refresh cookie. The\
        \ token is read from that cookie, else from the body (sessions stored before\
        \ the cookie). With neither, the answer is 401: there is no session to refresh."
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: "No refresh token, or an invalid, expired or revoked one"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/password/reset:
    post:
      tags:
      - Authentication
      summary: Reset password with a token
      description: Consumes a single-use reset token from the email link and sets
        a new password.
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: Password updated
        "400":
          description: "Invalid or expired token, or validation error"
  /api/v1/auth/password/forgot:
    post:
      tags:
      - Authentication
      summary: Request a password reset email
      description: "Always returns 200. To avoid revealing whether an account exists,\
        \ the response is identical whether or not a reset email was sent."
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          description: Request accepted (an email is sent only if a matching password
            account exists)
        "400":
          description: Validation error
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Sign this browser out
      description: "Clears the refresh-token cookie. Nothing is revoked server-side,\
        \ so the account's sessions on other browsers and devices carry on; signing\
        \ out everywhere is POST /api/v1/account/sessions/revoke."
      operationId: logout
      responses:
        "204":
          description: Cookie cleared
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Authenticate with email and password to receive a JWT
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/google:
    post:
      tags:
      - Authentication
      summary: Login with Google
      description: "Verify a Google ID token and log the user in, registering a new\
        \ account on first login"
      operationId: googleLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid Google ID token or unverified email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/google/code:
    post:
      tags:
      - Authentication
      summary: Login with a Google authorization code
      description: "Exchange a Google OAuth authorization code (from the top-level\
        \ redirect flow) for an ID token server-side and log the user in, registering\
        \ a new account on first login. Used by browsers that block the embedded Google\
        \ Sign-In button, such as iOS Safari."
      operationId: googleCodeLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCodeLoginRequest"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: "Invalid or expired authorization code, or unverified email"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Unrecognized redirect URI or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/facebook:
    post:
      tags:
      - Authentication
      summary: Login with Facebook
      description: "Verify a Facebook access token and log the user in, registering\
        \ a new account on first login"
      operationId: facebookLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacebookLoginRequest"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid Facebook access token or missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/admin/yahoo/connect:
    post:
      tags:
      - Admin
      summary: Start connecting the Yahoo service account
      description: Returns the Yahoo consent URL to send the admin's browser to. The
        resulting token is stored under the reserved service-account id.
      operationId: connectYahooServiceAccount
      responses:
        "200":
          description: Authorization URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeUrlResponse"
  /api/v1/admin/yahoo/connect/complete:
    post:
      tags:
      - Admin
      summary: Finish connecting the Yahoo service account
      description: "Attaches the Yahoo authorization from the consent the browser\
        \ just returned from to the service account, if the flow was started for it.\
        \ The code is single-use and expires after five minutes. 404 means it is unknown,\
        \ used or expired; 409 means a different account started this connection,\
        \ and the Yahoo authorization has been discarded."
      operationId: completeYahooServiceAccountConnect
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YahooLinkClaimRequest"
        required: true
      responses:
        "200":
          description: Service account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          description: Malformed code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: "Code unknown, already used or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: The connection was not started for the service account; discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/admin/premium/grants:
    post:
      tags:
      - Admin
      summary: "Give an account premium for a number of months, free"
      description: "Records a grant in the account's name, apart from any subscription,\
        \ so nothing is billed and a later provider event cannot overwrite it."
      operationId: grantPremium
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantPremiumRequest"
        required: true
      responses:
        "201":
          description: Premium granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPremiumGrantResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPremiumGrantResponse"
        "404":
          description: No account with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPremiumGrantResponse"
  /api/v1/admin/player/sync:
    post:
      tags:
      - Admin
      summary: Trigger a player sync
      description: Refreshes the cached player read model from Yahoo.
      operationId: triggerPlayerSync
      responses:
        "200":
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
  /api/v1/admin/player-ids/remap:
    post:
      tags:
      - Admin
      summary: Remap saved player ids from one platform's numbering to the other's
      description: "Matches the two player pools and rewrites the ids in every saved\
        \ projection, draft pick and share still on the other platform's numbering.\
        \ Reports the match before the write, and defaults to a dry run: pass dryRun=false\
        \ to actually apply it. The app should be serving the `to` platform's pool\
        \ afterwards, so switch PLAYERS_SOURCE with it."
      operationId: remapPlayerIds
      parameters:
      - name: dryRun
        in: query
        description: Write nothing and report what would change. Defaults to true.
        required: false
        schema:
          type: boolean
          default: true
      - name: to
        in: query
        description: "The numbering to move stored rows into. Defaults to ESPN, the\
          \ direction the first migration went."
        required: false
        schema:
          type: string
          default: ESPN
          enum:
          - YAHOO
          - ESPN
      responses:
        "200":
          description: "Match reported, and applied unless it was a dry run"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerIdRemapReport"
        "502":
          description: "Either pool came back short, or too little of the pool being\
            \ left matched to apply"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerIdRemapReport"
  /api/v1/admin/espn/players/sync:
    post:
      tags:
      - Admin
      summary: Trigger an ESPN player sync
      description: "Starts a refresh of the ESPN player pool — which is where the\
        \ pool comes from — and answers as soon as it is under way. The work runs\
        \ for minutes; watch it with GET /api/v1/admin/espn/players/sync/latest until\
        \ running is false and syncedAt has moved. Otherwise the pool only moves on\
        \ espn-service's nightly run, a long wait for a deployment that changed what\
        \ the sync stores."
      operationId: triggerEspnPlayerSync
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
        "409":
          description: A sync is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAcceptedResponse"
  /api/v1/account/sessions/revoke:
    post:
      tags:
      - Account
      summary: Sign the account out on every device
      description: "Revokes every refresh token the account holds, this device's included,\
        \ so each session ends the next time it tries to refresh. An access token\
        \ already issued stays valid until it expires (15 minutes)."
      operationId: signOutEverywhere
      responses:
        "204":
          description: Every session revoked
  /api/v1/yahoo/leagues:
    get:
      tags:
      - Yahoo
      summary: List the user's NHL fantasy leagues
      operationId: leagues
      responses:
        "200":
          description: Leagues returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
        "424":
          description: Yahoo refused the request (code YAHOO_ACCESS_DENIED); the message
            carries Yahoo's own wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/yahoo/leagues/{leagueKey}/projection-settings:
    get:
      tags:
      - Yahoo
      summary: Get a league's settings mapped to projection settings
      description: "Maps the Yahoo league's scoring basis (points vs category), active\
        \ stat columns, point weights, roster slots and size into the projection's\
        \ own shape."
      operationId: projectionSettings
      parameters:
      - name: leagueKey
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Mapped settings returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueProjectionSettingsResponse"
        "404":
          description: User has not connected Yahoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueProjectionSettingsResponse"
        "424":
          description: Yahoo refused the request (code YAHOO_ACCESS_DENIED); the message
            carries Yahoo's own wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/yahoo/leagues/{leagueKey}/draft:
    get:
      tags:
      - Yahoo
      summary: "Get a league's draft: its status, teams in draft order and the picks\
        \ made so far"
      description: Polled by the draft room while it follows the league's live draft.
        Picks name players by the pool's own ids. 404 where this environment does
        not offer following a draft.
      operationId: draft
      parameters:
      - name: leagueKey
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      responses:
        "200":
          description: Draft returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueDraftResponse"
        "404":
          description: "Not offered here, or the user has not connected Yahoo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "424":
          description: Yahoo refused the request (code YAHOO_ACCESS_DENIED); the message
            carries Yahoo's own wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/yahoo/connection:
    get:
      tags:
      - Yahoo
      summary: Whether the user has connected their Yahoo account
      operationId: connection
      responses:
        "200":
          description: Connection status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
  /api/v1/versions:
    get:
      tags:
      - Versions
      summary: Get service versions
      description: Returns the deployed version and reachability of the BFF and each
        downstream service
      operationId: getVersions
      responses:
        "200":
          description: Versions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionsResponse"
  /api/v1/streamer-planner/weeks:
    get:
      tags:
      - Streamer planner
      summary: The season's weeks
      description: "Monday-Sunday weeks of the newest published NHL season, numbered\
        \ from the week of opening night, and the week today falls in."
      operationId: streamerPlannerWeeks
      responses:
        "200":
          description: "The weeks, in order"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerWeeksResponse"
  /api/v1/streamer-planner/teams:
    get:
      tags:
      - Streamer planner
      summary: "Every team's schedule over a stretch, rated for streaming"
      description: "All NHL teams, best skater schedule first. The opponent rates\
        \ are those known the morning of `start`. A stretch covers at most 31 days."
      operationId: streamerPlannerTeams
      parameters:
      - name: start
        in: query
        description: "First date, e.g. 2026-10-12"
        required: true
        schema:
          type: string
          format: date
      - name: end
        in: query
        description: "Last date, inclusive"
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          description: "The teams, ranked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleStrengthResponse"
        "400":
          description: "`end` is before `start`, or the stretch is too long"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleStrengthResponse"
  /api/v1/streamer-planner/my-team:
    get:
      tags:
      - Streamer planner
      summary: "The user's own team in a league, today"
      description: "Read live from the platform: each player's club, the positions\
        \ the league may start him at, today's slot and whether he is out. Given a\
        \ stretch, also the model's line over it for each player it projects, on a\
        \ free agent's scale."
      operationId: streamerPlannerMyTeam
      parameters:
      - name: platform
        in: query
        description: Which platform's league to read
        required: true
        schema:
          type: string
          enum:
          - YAHOO
          - ESPN
      - name: leagueId
        in: query
        description: The Yahoo league key or the ESPN league id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - name: start
        in: query
        description: "First date of the stretch to give lines over, e.g. 2026-10-12"
        required: false
        schema:
          type: string
          format: date
      - name: end
        in: query
        description: "Last date, inclusive; given with start or not at all"
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: "The team, or found=false when none is the user's"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerMyTeamResponse"
        "400":
          description: "Only one of start and end, end before start, or too long a\
            \ stretch"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerMyTeamResponse"
  /api/v1/streamer-planner/free-agents:
    get:
      tags:
      - Streamer planner
      summary: "The players a league has available, with the model's line for the\
        \ stretch"
      description: "Joined on identity, so the answer does not depend on which platform\
        \ the player pool is served from. The stats are the projection's own vocabulary:\
        \ score them with the league's scoring settings."
      operationId: streamerPlannerFreeAgents
      parameters:
      - name: platform
        in: query
        description: Which platform's league to read
        required: true
        schema:
          type: string
          enum:
          - YAHOO
          - ESPN
      - name: leagueId
        in: query
        description: The Yahoo league key or the ESPN league id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - name: start
        in: query
        description: "First date, e.g. 2026-10-12"
        required: true
        schema:
          type: string
          format: date
      - name: end
        in: query
        description: "Last date, inclusive"
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          description: "Available players, best projected first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeAgentListResponse"
        "400":
          description: "`end` is before `start`, or the stretch is too long"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeAgentListResponse"
  /api/v1/start-bench/rest-of-season:
    get:
      tags:
      - Start/Bench
      summary: "The user's own team in a league, with the model's rest of the season"
      description: "Each player on the user's team today with the model's rest of\
        \ the season, the line FA Scout ranks a team by. Start/Bench ranks the team\
        \ by it to name the player to drop when a healthy player comes off injured\
        \ reserve and the roster has no open spot. Read live from the platform."
      operationId: startBenchRestOfSeason
      parameters:
      - name: platform
        in: query
        description: Which platform's league to read
        required: true
        schema:
          type: string
          enum:
          - YAHOO
          - ESPN
      - name: leagueId
        in: query
        description: The Yahoo league key or the ESPN league id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      responses:
        "200":
          description: "The user's team, or found=false"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoutMyTeamResponse"
        "404":
          description: Start/Bench is off in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoutMyTeamResponse"
  /api/v1/start-bench/my-team:
    get:
      tags:
      - Start/Bench
      summary: The user's own team in a league as set for a day
      description: "Read live from the platform: each player's club, the positions\
        \ the league may start him at, the slot he holds that day (for a day ahead,\
        \ what the manager has set for it) and whether he is out. Each player the\
        \ model projects also carries its line for that day alone, on a free agent's\
        \ scale: his one game, if his club plays, weighed by the chance he dresses,\
        \ or starts for a goalie."
      operationId: startBenchMyTeam
      parameters:
      - name: platform
        in: query
        description: Which platform's league to read
        required: true
        schema:
          type: string
          enum:
          - YAHOO
          - ESPN
      - name: leagueId
        in: query
        description: The Yahoo league key or the ESPN league id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - name: date
        in: query
        description: "The day, e.g. 2026-10-13"
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          description: "The team, or found=false when none is the user's"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerMyTeamResponse"
        "400":
          description: The date is missing or not a date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerMyTeamResponse"
        "404":
          description: Start/Bench is off in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerMyTeamResponse"
  /api/v1/shared/{token}:
    get:
      tags:
      - Shared projections
      summary: Fetch a shared projection by its token
      description: "Public: anyone holding the link reads the whole published board,\
        \ signed in or not. Returns the snapshot as it was when shared, with no identity\
        \ beyond the owner's public username."
      operationId: getSharedProjection
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Shared projection found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedProjectionResponse"
        "404":
          description: "No share with that token, or it was taken down"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedProjectionResponse"
  /api/v1/shared/{token}/avatar:
    get:
      tags:
      - Shared projections
      summary: Fetch the profile picture of whoever shared a projection
      description: "Public, like the page it is drawn on. `authorAvatar` on the shared\
        \ projection is the address to ask at, and is absent where the author has\
        \ no picture."
      operationId: getSharedProjectionAuthorAvatar
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Picture returned
          content:
            image/*:
              schema:
                type: string
                format: byte
        "404":
          description: "No share with that token, or its author has no picture"
          content:
            image/*:
              schema:
                type: string
                format: byte
  /api/v1/role-changes:
    get:
      tags:
      - Role changes
      summary: Every skater's recent ice and power-play role beside his baseline
      description: "Measured, not projected. The recent stretch is each club's own\
        \ last N games; the baseline is the skater's earlier games this season once\
        \ he has five, else his last season. The power-play share is read against\
        \ his club's power-play time, so a club drawing more power plays does not\
        \ read as a promotion. Unsorted."
      operationId: roleChanges
      parameters:
      - name: season
        in: query
        description: Season start year; defaults to the newest season with a game
          played
        required: false
        schema:
          type: integer
          format: int32
          maximum: 2100
          minimum: 1917
      - name: recentGames
        in: query
        description: N in each club's own last N games
        required: false
        schema:
          type: integer
          format: int32
          default: 5
          maximum: 20
          minimum: 1
      responses:
        "200":
          description: Every skater who dressed in the recent games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleChangeListResponse"
        "404":
          description: Role changes are off in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleChangeListResponse"
  /api/v1/projection-model/splits/skaters:
    get:
      tags:
      - Projection model
      summary: Skaters' measured totals over a range of a season's games
      description: "What players actually produced over a stretch of their team's\
        \ schedule — measured, not projected. Ranges are in team game numbers, so\
        \ the same range covers the same stretch for every player; one who missed\
        \ some of them shows fewer games. Give either fromGame/toGame or lastGames;\
        \ with neither, the whole season is covered. Reading further back than the\
        \ last 5 games needs a premium subscription."
      operationId: skaterSplits
      parameters:
      - name: season
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: fromGame
        in: query
        description: First team game in the range (1-based)
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: toGame
        in: query
        description: "Last team game in the range, inclusive"
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: lastGames
        in: query
        description: "Shorthand for each team's own last N games, counted back from\
          \ the latest game it has played, so it means the same mid-season as in a\
          \ finished one"
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
          maximum: 1000
          minimum: 1
      responses:
        "200":
          description: "Totals over the range, highest scoring first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerSplitResponse"
        "403":
          description: The range needs premium and this account has none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerSplitResponse"
  /api/v1/projection-model/splits/seasons:
    get:
      tags:
      - Projection model
      summary: The seasons Who's hot can measure
      description: "Newest first, each with `scheduleGames`, its own length (82, or\
        \ 84 from 2026-27), and `gamesPlayed`, the furthest any team has got, so a\
        \ client drawing a range assumes neither. The projected season is listed before\
        \ its first game. `defaultSeason` is the season a split with no season reads:\
        \ the newest with a game played, which is last season until the new one is\
        \ underway."
      operationId: splitSeasons
      responses:
        "200":
          description: "The seasons, newest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitSeasonListResponse"
  /api/v1/projection-model/splits/goalies:
    get:
      tags:
      - Projection model
      summary: Goalies' measured totals over a range of a season's games
      description: Reading further back than the last 5 games needs a premium subscription.
      operationId: goalieSplits
      parameters:
      - name: season
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: fromGame
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: toGame
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: lastGames
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 84
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
          maximum: 1000
          minimum: 1
      responses:
        "200":
          description: Totals over the range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerSplitResponse"
        "403":
          description: The range needs premium and this account has none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerSplitResponse"
  /api/v1/projection-model/seed:
    get:
      tags:
      - Projection model
      summary: Generate projection lines for every mapped player
      description: "Returns the model's projected stat lines keyed by this platform's\
        \ player id, ready to be saved as a new projection. Scoring settings are not\
        \ included — those belong to the user's league, so the client supplies them\
        \ when saving. Needs a premium subscription: these are the model's own lines,\
        \ unless both limits are small enough to be the preview a free account is\
        \ shown (at most 25 skaters and 10 goalies). `skaterLimit` and `goalieLimit`\
        \ return only the top of the board — skaters by projected points, goalies\
        \ by projected wins, the same order the player pool is served in — for a caller\
        \ drawing a preview rather than seeding a projection. They trim the rows and\
        \ nothing else: the counts still report everything the model reached, so a\
        \ five-row preview can still say how much of the league that is. `source=rest_of_season`\
        \ serves the model's line for what is left of the season under way instead\
        \ - the lines `POST /api/v1/projections` with that source writes - on the\
        \ same terms; it is refused while no season is under way."
      operationId: seed
      parameters:
      - name: season
        in: query
        description: Season to project; defaults to the configured one
        required: false
        schema:
          type: integer
          format: int32
      - name: source
        in: query
        description: "Which of the model's lines: the whole season (`model`, the default)\
          \ or what is left of the one under way (`rest_of_season`)"
        required: false
        schema:
          type: string
          default: model
          enum:
          - model
          - rest_of_season
      - name: skaterLimit
        in: query
        description: How many skater lines to return; all of them when absent
        required: false
        schema:
          type: integer
          format: int32
          maximum: 500
          minimum: 1
      - name: goalieLimit
        in: query
        description: How many goalie lines to return; all of them when absent
        required: false
        schema:
          type: integer
          format: int32
          maximum: 500
          minimum: 1
      responses:
        "200":
          description: Generated lines plus a summary of what was skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeededProjectionResponse"
        "400":
          description: "A limit is not between 1 and 500, source is not one of the\
            \ two, or the rest of the season was asked for while no season is under\
            \ way"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeededProjectionResponse"
        "403":
          description: More than the free preview needs premium and this account has
            none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeededProjectionResponse"
        "404":
          description: "The AI projection, or for source=rest_of_season the rest-of-season\
            \ preset, is switched off"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeededProjectionResponse"
  /api/v1/projection-model/rest-of-season/status:
    get:
      tags:
      - Projection model
      summary: Whether a season is under way for the model right now
      description: "Whether the model has a rest of the season at the moment: true\
        \ from a season's first game to its last, when its served lines cover what\
        \ is left of it rather than a whole season, and `POST /api/v1/projections`\
        \ with `source=rest_of_season` would be seeded (where that preset is on, which\
        \ `/api/v1/features` says). Served wherever the AI projection is, so a page\
        \ can know before it shows a choice whether the model ranks the rest of the\
        \ season. Says nothing about this account's plan — the rest of the season\
        \ needs premium like the AI projection, and a client shows it locked rather\
        \ than hiding it."
      operationId: restOfSeasonStatus
      responses:
        "200":
          description: Whether the rest of the season is there
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestOfSeasonStatusResponse"
        "404":
          description: The AI projection is switched off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestOfSeasonStatusResponse"
  /api/v1/projection-model/board:
    get:
      tags:
      - Projection model
      summary: The rows a projection created from the model would start with
      description: "Exactly the rows `POST /api/v1/projections` with `source=model`\
        \ (or, with `source=rest_of_season`, that source) writes, without writing\
        \ anything: the model's lines, plus last season's line for every player in\
        \ the pool the model does not reach. For previewing the AI starting points,\
        \ so the preview ranks the board it creates and not a slice of it. Needs a\
        \ premium subscription."
      operationId: modelBoard
      parameters:
      - name: source
        in: query
        description: "Which starting point: the whole season (`model`, the default)\
          \ or what is left of the one under way (`rest_of_season`)"
        required: false
        schema:
          type: string
          default: model
          enum:
          - model
          - rest_of_season
      responses:
        "200":
          description: Every row the new projection would hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelBoardResponse"
        "400":
          description: "source is not one of the two, or the rest of the season was\
            \ asked for while no season is under way"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelBoardResponse"
        "403":
          description: This account has no premium
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelBoardResponse"
        "404":
          description: "The AI projection, or for source=rest_of_season the rest-of-season\
            \ preset, is switched off"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelBoardResponse"
