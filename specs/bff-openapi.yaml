  /api/v1/league-summaries/yahoo/{leagueKey}:
    get:
      tags:
      - League summaries
      summary: Total a Yahoo league's teams against a projection
      description: "Reads the league's rosters, draft and scoring settings from Yahoo\
        \ and totals every team's current roster, or its picks until the draft is\
        \ over. Only a team's best players by projected value count, as many as the\
        \ league's roster spots less injured reserve, whatever slot each holds. The\
        \ teams, their totals and where each one places are returned to any signed-in\
        \ manager, with the roster rows and lineups behind those totals. 404 where\
        \ this environment does not offer reading a league's draft, where the AI projection\
        \ is off and the model was asked for, or where the board is not the user's\
        \ to read."
      operationId: yahooLeague
      parameters:
      - name: leagueKey
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - name: source
        in: query
        description: Which projection to score the players against; the model by default
        required: false
        schema:
          type: string
          maxLength: 32
          minLength: 0
      - name: projectionId
        in: query
        description: "The board to score the players against, one of the user's own\
          \ or one they follow. Implies `source=projection`, which needs it."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "The league's teams, totalled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSummaryResponse"
        "400":
          description: "Unknown source, or a source and a board that do not go together"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: "Not offered here, the AI projection is off, or the user has\
            \ not connected Yahoo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "424":
          description: Yahoo refused the request (code YAHOO_ACCESS_DENIED); the message
            carries Yahoo's own wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
