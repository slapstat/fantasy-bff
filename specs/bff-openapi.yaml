          maxLength: 64
          minLength: 0
        seenUpdatedAt:
          type: string
          format: date-time
          description: "The shared board's `updatedAt` as the page last read it. Send\
            \ it, and a board its author has changed since is refused with 412 instead\
            \ of copied, so the reader never gets numbers they did not see: read the\
            \ share again and retry. Left out, the board is copied as it is now."
