            $ref: "#/components/schemas/DraftAnalysisTeam"
        picks:
          type: array
          description: "The picks made, in order"
          items:
            $ref: "#/components/schemas/DraftAnalysisPick"
      required:
      - auction
      - picks
      - premium
      - preseason
      - scoringType
      - status
      - teams
    DraftAnalysisTeam:
      type: object
      description: "One team's draft, summed over its picks"
