  /api/v1/admin/yahoo/probe:
    get:
      tags:
      - Admin
      summary: Ask Yahoo whether it will serve a game's players
      description: "One live call, reporting the status Yahoo answered with and its\
        \ own error wording. A failing sync only says that something was refused;\
        \ vary the game key and season here to find out what. Reads nothing into the\
        \ cache and writes nothing."
      operationId: probeYahooAccess
      parameters:
      - name: gameKey
        in: query
        description: "Yahoo game: \"nhl\" for the current season, or a numeric key\
          \ to pin a past one"
        required: false
        schema:
          type: string
          default: nhl
      - name: season
        in: query
        description: Season start year; omit to send no season filter at all
        required: false
        schema:
          type: string
      - name: leagueKey
        in: query
        description: "Ask this league's players instead of the whole game's. The granted\
          \ Yahoo scope is about leagues, so this may be served where a game is refused\
          \ — and that difference is the diagnosis."
        required: false
        schema:
          type: string
      - name: target
        in: query
        description: "Set to \"leagues\" to ask the floor question instead: can this\
          \ account list its own leagues at all? Everything else is ignored. A refusal\
          \ here means no route into the Fantasy API is open, not that the wrong one\
          \ was chosen."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "What Yahoo answered, refusal included"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooProbeResponse"
  /api/v1/admin/yahoo/probe/league:
    get:
      tags:
      - Admin
      summary: Read one of your own leagues' Yahoo resources raw
      description: "What Yahoo sends for a league's settings, teams, draftresults,\
        \ or the three together (draft), verbatim, read with your own Yahoo connection.\
        \ Only your own: the user id comes from the signed-in admin and never from\
        \ the request, so this cannot be aimed at another member's league. For seeing\
        \ which fields Yahoo actually fills in a real league before code relies on\
        \ them — the service account belongs to no such league."
      operationId: probeOwnLeagueResource
      parameters:
      - name: leagueKey
        in: query
        description: "A league the signed-in admin belongs to, e.g. 477.l.124453"
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - name: resource
        in: query
        description: "settings, teams, draftresults, or draft for the three together"
        required: true
        schema:
          type: string
          maxLength: 32
          minLength: 0
      responses:
        "200":
          description: "What Yahoo answered, refusal included"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooLeagueProbeResponse"
  /api/v1/admin/yahoo/leagues:
    get:
      tags:
      - Admin
      summary: The Yahoo service account's own leagues
      description: "Hands you a league key for the probe without hunting for one,\
        \ and is itself a test: succeeding here while a game probe is refused places\
        \ the refusal on what was asked for rather than on who asked."
      operationId: yahooServiceAccountLeagues
      responses:
        "200":
          description: Leagues returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguesResponse"
        "424":
          description: Yahoo refused the request (code YAHOO_ACCESS_DENIED); the message
            carries Yahoo's own wording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /api/v1/admin/yahoo/connection:
    get:
      tags:
      - Admin
      summary: Whether the Yahoo service account is connected
      operationId: yahooServiceConnection
      responses:
        "200":
          description: Connection status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
  /api/v1/admin/streamer-planner/free-agents:
    get:
      tags:
      - Streamer planner
      summary: "Admin demo: the Yahoo pool under a percent rostered, with the model's\
        \ line for the stretch"
      description: "The same list as a league's free agents, read without a league:\
        \ every pool player Yahoo rosters in at most `maxPercentRostered` percent\
        \ of its leagues. A player Yahoo gives no percentage for is left out, and\
        \ availability is UNKNOWN for all, since nobody is on waivers without a league."
      operationId: streamerPlannerPoolFreeAgents
      parameters:
      - name: start
        in: query
        description: "First date, e.g. 2026-10-12"
        required: true
        schema:
          type: string
          format: date
      - name: end
        in: query
        description: "Last date, inclusive"
        required: true
        schema:
          type: string
          format: date
      - name: maxPercentRostered
        in: query
        description: "Highest Yahoo percent rostered to include, 0-100"
        required: true
        schema:
          type: number
          format: double
          maximum: 100.0
          minimum: 0.0
      responses:
        "200":
          description: Pool players under the threshold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeAgentListResponse"
        "400":
          description: "`end` is before `start`, the stretch is too long, or the threshold\
            \ is outside 0-100"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeAgentListResponse"
        "403":
          description: The caller is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeAgentListResponse"
  /api/v1/admin/premium/customers:
    get:
      tags:
      - Admin
      summary: Everyone with premium right now
      description: "Paying subscribers and accounts on a grant, newest account first.\
        \ Each row says which of the two it is, and when premium runs out."
      operationId: premiumCustomers
      responses:
        "200":
          description: Customers returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPremiumCustomerResponse"
  /api/v1/admin/player/sync/runs:
    get:
      tags:
      - Admin
      summary: Recent player sync runs
      description: Outcome (counts) and the diff (players added/removed) of the most
        recent syncs.
      operationId: playerSyncRuns
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: Runs returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncRunResponse"
  /api/v1/admin/espn/players/sync/latest:
    get:
      tags:
      - Admin
      summary: When the ESPN player pool was last refreshed
      description: "And whether a sync is running right now, which is how a triggered\
        \ one is watched to completion."
      operationId: espnPlayerSyncStatus
      responses:
        "200":
          description: Status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSyncStatusResponse"
  /api/v1/account:
    get:
      tags:
      - Account
      summary: Fetch the signed-in account's profile
      operationId: getAccount
      responses:
        "200":
          description: Profile returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /api/v1/admin/premium/grants/{userId}:
    delete:
      tags:
      - Admin
      summary: End an account's granted premium
      description: Takes back premium that was given by hand. A paid subscription
        is left alone.
      operationId: revokePremiumGrants
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Any granted premium was ended
components:
  schemas:
    DraftPick:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        teamId:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - playerId
      - teamId
    DraftSettings:
      type: object
      properties:
        scoringType:
          type: string
          enum:
          - points
          - category
        statWeights:
          type: object
          additionalProperties:
            type: number
            format: double
        activeScoringColumns:
          type: array
          items:
            type: string
            maxLength: 32
            minLength: 0
          maxItems: 100
          minItems: 0
        activeUtilityColumns:
          type: array
          items:
            type: string
            maxLength: 32
            minLength: 0
          maxItems: 100
          minItems: 0
        leagueSize:
          type: integer
          format: int32
          description: Number of teams. Category leagues only — absent for points
            leagues.
          maximum: 30
          minimum: 2
        rosterSlots:
          $ref: "#/components/schemas/RosterSlots"
          description: Roster slots per team; the draft's rosters are built from them.
        minGoalieGames:
          type: integer
          format: int32
          description: "Minimum projected games for a goalie to qualify in category\
            \ ranking, up to a full 84-game season. Category leagues only."
          maximum: 84
          minimum: 0
        yahooSync:
          $ref: "#/components/schemas/YahooSync"
        espnSync:
          $ref: "#/components/schemas/EspnSync"
        lastEspnLeagueId:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - activeScoringColumns
      - activeUtilityColumns
      - rosterSlots
      - scoringType
      - statWeights
    DraftState:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/DraftTeam"
          maxItems: 32
          minItems: 0
        order:
          type: array
          items:
            type: string
            maxLength: 64
            minLength: 0
          maxItems: 32
          minItems: 0
        picks:
          type: array
          items:
            $ref: "#/components/schemas/DraftPick"
        finishedAt:
          type: string
          format: date-time
        settings:
          $ref: "#/components/schemas/DraftSettings"
          description: "The league this draft is ranked by, set up with the draft.\
            \ Absent on a draft saved before drafts held their own league, which is\
            \ ranked by the projection's settings instead."
        following:
          type: boolean
          description: "Whether the board follows its linked league's live draft:\
            \ the sync switch as the user left it, so a reload picks the league's\
            \ draft back up. Absent on a board that never followed, which reads as\
            \ not following."
      required:
      - order
      - picks
      - teams
    DraftTeam:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 0
        name:
          type: string
          maxLength: 64
          minLength: 0
        mine:
          type: boolean
      required:
      - id
      - mine
      - name
    EspnSync:
      type: object
      properties:
        leagueName:
          type: string
          maxLength: 200
          minLength: 0
        leagueId:
          type: string
          maxLength: 50
          minLength: 0
        syncedAt:
          type: string
          format: date-time
      required:
      - leagueId
      - leagueName
      - syncedAt
    ManualRanking:
      type: object
      properties:
        skater:
          $ref: "#/components/schemas/PlayerTypeRanking"
        goalie:
          $ref: "#/components/schemas/PlayerTypeRanking"
      required:
      - goalie
      - skater
    PlayerProjection:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - skater
          - goalie
        stats:
          $ref: "#/components/schemas/PlayerStats"
      required:
      - playerId
      - stats
      - type
    PlayerStats:
      type: object
      properties:
        utility:
          type: object
          additionalProperties:
            type: number
            format: double
        scoring:
          type: object
          additionalProperties:
            type: number
            format: double
      required:
      - scoring
      - utility
    PlayerTypeRanking:
      type: object
      properties:
        mode:
          type: string
          description: Whether this player type is ordered by its projected stats
            or by the order the owner put it in.
          enum:
          - projected
          - manual
        order:
          type: array
          description: "The player ids the owner placed by hand, best first. Players\
            \ of this type that are absent keep their projected order below the placed\
            \ ones, so an owner who ranked only a top twenty does not have to place\
            \ the rest. Ignored while mode is `projected`. The cap matches the player\
            \ list."
          items:
            type: integer
            format: int32
          maxItems: 2000
          minItems: 0
      required:
      - mode
    PositionOverride:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        positions:
          type: array
          items:
            type: string
            enum:
            - LW
            - C
            - RW
            - D
          maxItems: 4
          minItems: 0
      required:
      - playerId
      - positions
    ProjectionSettings:
      type: object
      properties:
        scoringType:
          type: string
          enum:
          - points
          - category
        statWeights:
          type: object
          additionalProperties:
            type: number
            format: double
        activeScoringColumns:
          type: array
          items:
            type: string
        activeUtilityColumns:
          type: array
          items:
            type: string
        scaleSettings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ScaleConfig"
        decimalSettings:
          type: object
          additionalProperties:
            type: integer
            format: int32
        useDefaultDecimals:
          type: boolean
        leagueSize:
          type: integer
          format: int32
          maximum: 30
          minimum: 2
        rosterSlots:
          $ref: "#/components/schemas/RosterSlots"
        minGoalieGames:
          type: integer
          format: int32
          maximum: 84
          minimum: 0
        yahooSync:
          $ref: "#/components/schemas/YahooSync"
        espnSync:
          $ref: "#/components/schemas/EspnSync"
        lastEspnLeagueId:
          type: string
          maxLength: 50
          minLength: 0
        playerBasis:
          type: string
          enum:
          - last_season
          - blank
          - model
          - rest_of_season
        playerPoolSyncedAt:
          type: string
          format: date-time
        unacknowledgedNewPlayerIds:
          type: array
          description: "Players a reconciliation with the player pool added whom the\
            \ owner has not acknowledged yet. Kept until they are, so the app can\
            \ go on saying so across reloads and devices; send it back empty or absent\
            \ to acknowledge them. The cap matches the player list."
          items:
            type: integer
            format: int32
          maxItems: 2000
          minItems: 0
        manualRanking:
          $ref: "#/components/schemas/ManualRanking"
          description: "Per player type, whether the rankings follow the projected\
            \ stats or the order the owner put the players in, and that order. Absent\
            \ means both types are ranked by their projected stats."
      required:
      - activeScoringColumns
      - activeUtilityColumns
      - decimalSettings
      - scaleSettings
      - scoringType
      - statWeights
      - useDefaultDecimals
    RosterSlots:
      type: object
      properties:
        c:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        lw:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        rw:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        w:
          type: integer
          format: int32
          description: "Wing flex slots, filled by a LW or a RW. Read as 0 when absent."
          maximum: 50
          minimum: 0
        f:
          type: integer
          format: int32
          description: "Forward flex slots, filled by a C, a LW or a RW. Read as 0\
            \ when absent."
          maximum: 50
          minimum: 0
        d:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        util:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        bn:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
        g:
          type: integer
          format: int32
          maximum: 50
          minimum: 0
      required:
      - bn
      - c
      - d
      - f
      - g
      - lw
      - rw
      - util
      - w
    ScaleConfig:
      type: object
      properties:
        scale:
          type: boolean
        scalableStats:
          type: array
          items:
            type: string
      required:
      - scalableStats
      - scale
    UpdateProjectionData:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/ProjectionSettings"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerProjection"
        draft:
          $ref: "#/components/schemas/DraftState"
        positionOverrides:
          type: array
          description: "Positions the owner set by hand. Omit to keep the stored ones,\
            \ so a save that has nothing to do with positions cannot clear them. Send\
            \ an empty list to put every player back on the positions the read model\
            \ reports."
          items:
            $ref: "#/components/schemas/PositionOverride"
      required:
      - settings
    UpdateProjectionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        data:
          $ref: "#/components/schemas/UpdateProjectionData"
      required:
      - data
      - name
    YahooSync:
      type: object
      properties:
        leagueName:
          type: string
          maxLength: 200
          minLength: 0
        leagueKey:
          type: string
          maxLength: 100
          minLength: 0
        syncedAt:
          type: string
          format: date-time
      required:
      - leagueKey
      - leagueName
      - syncedAt
    ProjectionData:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/ProjectionSettings"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerProjection"
        draft:
          $ref: "#/components/schemas/DraftState"
        positionOverrides:
          type: array
          description: "Positions the owner set by hand, replacing what the player\
            \ read model reports for that skater. Absent or empty means every player\
            \ keeps its reported positions."
          items:
            $ref: "#/components/schemas/PositionOverride"
      required:
      - players
      - settings
    ProjectionOrigin:
      type: object
      properties:
        shareToken:
          type: string
        authorUsername:
          type: string
      required:
      - authorUsername
      - shareToken
    ProjectionResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - projection
          - draft
          - imported
        season:
          type: string
          description: "The season this projection is for, as its 8-digit code."
        data:
          $ref: "#/components/schemas/ProjectionData"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        origin:
          $ref: "#/components/schemas/ProjectionOrigin"
          description: "The share link this board follows, and who published it. Present\
            \ only on a follow, which is read-only apart from its draft, and never\
            \ stale: the follow goes when the share does. Absent on the user's own\
            \ boards, including a copy taken from a link."
        sourceProjectionId:
          type: string
          description: "The board a draft was started from. Absent on anything that\
            \ is not a draft, on a draft started from a preset, and once that board\
            \ is deleted — a draft holds its own copy of the numbers and outlives\
            \ it."
        autoNamed:
          type: boolean
          description: "Whether the name is still the one the server gave this row.\
            \ False once its owner has renamed it, which a league sync then leaves\
            \ alone."
      required:
      - autoNamed
      - createdAt
      - data
      - id
      - kind
      - name
      - season
      - updatedAt
    ShareProjectionRequest:
      type: object
      properties:
        players:
          type: array
          description: "The ranked rows to publish, in display order. A share carries\
            \ the whole board, so this is the client's entire ranking rather than\
            \ the top of it; the cap is a safety limit sized above the largest player\
            \ pool."
          items:
            $ref: "#/components/schemas/SharedPlayer"
          maxItems: 2000
          minItems: 0
      required:
      - players
    SharedPlayer:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 100
          minLength: 0
        teamAbbrev:
          type: string
          maxLength: 10
          minLength: 0
        headshot:
          type: string
          maxLength: 300
          minLength: 0
        positions:
          type: array
          items:
            type: string
            maxLength: 4
            minLength: 0
          maxItems: 6
          minItems: 0
        type:
          type: string
          enum:
          - skater
          - goalie
        rank:
          type: integer
          format: int32
          minimum: 1
        value:
          type: number
          format: double
        stats:
          $ref: "#/components/schemas/PlayerStats"
      required:
      - name
      - playerId
      - rank
      - stats
      - type
      - value
    ShareLinkResponse:
      type: object
      properties:
        token:
          type: string
        shareUrl:
          type: string
          description: "The public link to share, e.g. https://slapstat.com/s/<token>"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - shareUrl
      - token
      - updatedAt
    RenameProjectionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        derived:
          type: boolean
          description: "True when the app derived the name rather than the user typing\
            \ it — a draft taking the name of the league it was just synced with.\
            \ Such a rename is skipped where the user has named the row themselves,\
            \ and a name another row holds is numbered rather than refused."
      required:
      - name
    ProjectionSummaryResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - projection
          - draft
          - imported
        preset:
          type: string
          description: "Which shared starting point a draft was started from. Absent\
            \ on any other kind, on a draft started from one of the user's own boards,\
            \ and on preset drafts saved before this was recorded."
          enum:
          - last_season
          - model
          - rest_of_season
        season:
          type: string
          enum:
          - "20252026"
          - "20262027"
          - "20272028"
          - "20282029"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        draftStatus:
          type: string
          enum:
          - none
          - in_progress
          - finished
        origin:
          $ref: "#/components/schemas/ProjectionOrigin"
          description: "The share link this board follows, and who published it. Present\
            \ only on a follow. `kind: imported` alone does not mean one: a spreadsheet\
            \ import is the user's own rows and a copy taken from a link is their\
            \ own board, and neither carries an origin."
        sourceProjectionId:
          type: string
          description: "The board a draft was started from. Absent on anything that\
            \ is not a draft, on a draft started from a preset, and once that board\
            \ is deleted — a draft holds its own copy of the numbers and outlives\
            \ it."
        autoNamed:
          type: boolean
          description: "Whether the name is still the one the server gave this row.\
            \ False once its owner has renamed it, which a league sync then leaves\
            \ alone."
      required:
      - autoNamed
      - createdAt
      - draftStatus
      - id
      - kind
      - name
      - season
      - updatedAt
    EspnCredentialsRequest:
      type: object
      properties:
        espnS2:
          type: string
          description: The user's espn_s2 cookie value.
          maxLength: 1024
          minLength: 0
        swid:
          type: string
          description: The user's SWID cookie value (including the braces).
          maxLength: 128
          minLength: 0
      required:
      - espnS2
      - swid
    SetUsernameRequest:
      type: object
      properties:
        username:
          type: string
          description: "Letters, digits and underscores, 3–20 characters. Shown publicly\
            \ wherever the account publishes something."
          maxLength: 20
          minLength: 3
          pattern: "^[A-Za-z0-9_]+$"
      required:
      - username
    AccountResponse:
      type: object
      properties:
        email:
          type: string
        username:
          type: string
          description: "The account's public name; absent until the user picks one,\
            \ which sharing a projection requires"
      required:
      - email
    AuthorizeUrlResponse:
      type: object
      properties:
        authorizeUrl:
          type: string
      required:
      - authorizeUrl
    YahooLinkClaimRequest:
      type: object
      properties:
        code:
          type: string
          description: The one-time link code the Yahoo callback put in the web app's
            URL fragment.
          maxLength: 128
          minLength: 0
      required:
      - code
    ErrorDto:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
    ConnectionResponse:
      type: object
      properties:
        connected:
          type: boolean
      required:
      - connected
    CreateProjectionRequest:
      type: object
      properties:
        name:
          type: string
          description: "What to call it. A name the user already holds is numbered\
            \ (\"AI Projection (2)\") rather than refused, so the saved name is the\
            \ one in the response."
          maxLength: 100
          minLength: 0
        kind:
          type: string
          description: "What the projection is for. Defaults to the user's own. A\
            \ preset draft requires source=default, source=model or source=rest_of_season\
            \ and is named by the server. An imported board may be created with the\
            \ caller's own rows (a spreadsheet import): it takes data.players, refuses\
            \ source, and carries no share origin."
          enum:
          - projection
          - draft
          - imported
        data:
          $ref: "#/components/schemas/ProjectionData"
        source:
          type: string
          description: Fill data.players from the server's player read model instead
            of sending them. Requires data.players to be empty; omit it to send your
            own rows.
          enum:
          - default
          - blank
          - model
          - rest_of_season
      required:
      - data
      - name
    StartDraftRequest:
