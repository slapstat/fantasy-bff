          description: The model's NHL id for him
        name:
          type: string
        teamAbbrev:
          type: string
          description: "The club he is on, in the platform's own spelling"
        type:
          type: string
          description: skater or goalie
        positions:
          type: array
          description: Every position the league may start him at
          items:
            type: string
        availability:
          type: string
          description: "FREE_AGENT to add now, WAIVERS to claim first, UNKNOWN when\
            \ the platform does not say; absent for a rostered player"
          enum:
          - FREE_AGENT
          - WAIVERS
          - UNKNOWN
        owner:
          $ref: "#/components/schemas/ScoutOwner"
          description: The league team holding him; absent when the league has him
            available
        slot:
          type: string
          description: "The slot he sits in on his team today, in the platform's spelling;\
            \ absent for an available player or when the platform does not say"
        injuryStatus:
          type: string
          description: The platform's injury status; absent for a healthy player
        gamesRemaining:
          type: integer
          format: int32
          description: "His club's games still to play today: the schedule both lines\
            \ are spread over"
        now:
          $ref: "#/components/schemas/ScoutLine"
          description: "The model's rest of the season today, lifted to the season\
            \ line's scale"
        then:
          $ref: "#/components/schemas/ScoutLine"
          description: "The model's line for him as it stood on the chosen day, rescaled\
            \ to the games his club has left today: its per-game rates over the share\
            \ of those games it expected him to play. Absent when the model had no\
            \ line for him then."
      required:
      - gamesRemaining
      - name
      - nhlId
      - now
      - playerId
      - positions
      - type
    ScoutOwner:
      type: object
      description: The league team holding a player
      properties:
        teamName:
          type: string
          description: The team's name in the league
        mine:
          type: boolean
          description: True when it is the user's own team
      required:
      - mine
      - teamName
    ScoutSince:
      type: object
      description: "The earlier day the players' then-lines stand for, and what answered\
        \ it"
      properties:
        requested:
          type: string
          format: date
          description: The day the client asked for; absent for the preseason line
        kind:
          type: string
          description: "SNAPSHOT when a day's kept line answered, PRESEASON when the\
            \ model's line from the eve of the season did (asked for, or the newest\
            \ before the day asked for), NONE when neither is stored and no player\
            \ has a then-line"
          enum:
          - SNAPSHOT
          - PRESEASON
          - NONE
        resolved:
          type: string
          format: date
          description: "The day the kept line was counted from, for SNAPSHOT; absent\
            \ otherwise"
        earliestSnapshot:
          type: string
          format: date
          description: The first day a line is kept for this season; absent while
            none is
      required:
      - kind
    ClubGames:
      type: object
      description: The dates an NHL club still plays this season
      properties:
        team:
          type: string
          description: "NHL abbreviation, e.g. TBL"
        dates:
          type: array
          description: "Game dates from today on, earliest first"
          items:
            type: string
            format: date
        games:
          type: array
          description: "The same games with who each is against and where, earliest\
            \ first"
          items:
            $ref: "#/components/schemas/ClubNight"
      required:
      - dates
      - games
      - team
    ClubNight:
      type: object
      description: "One of an NHL club's remaining games: the date, the opponent and\
        \ the venue"
      properties:
        date:
          type: string
          format: date
        opponent:
          type: string
          description: The opponent's NHL abbreviation; absent where the schedule
            names none
        home:
          type: boolean
          description: The club plays at home
      required:
      - date
      - home
    OpponentWorth:
      type: object
      description: "What a game against an opponent, at home or away, is worth to\
        \ a player's line against an average night, as projection-service rates it\
        \ today"
      properties:
        opponent:
          type: string
          description: The opponent's NHL abbreviation
        home:
          type: boolean
          description: "The player's club plays at home, the opponent away"
        statWorth:
          type: object
          additionalProperties:
            type: number
            format: double
          description: "What the game is worth to each stat against an average night:\
            \ 1.1 is 10% more. Keyed by the players' stat keys; a stat not listed\
            \ is worth an average night"
        plusMinusPerMinute:
          type: number
          format: double
          description: "What the game adds to a player's plus-minus per minute of\
            \ his ice, which moves by an amount rather than a share"
      required:
      - home
      - opponent
      - plusMinusPerMinute
      - statWorth
    PlayerScoutTeamResponse:
      type: object
      description: "The user's own team with the model's rest of the season, and the\
        \ clubs' remaining nights"
      properties:
        found:
          type: boolean
          description: "False when no team in the league is the user's: a league they\
            \ only follow, or an ESPN league read without their cookies"
        teamName:
          type: string
          description: The team's name; absent when not found
        players:
          type: array
          description: "Its players today, bench and injured reserve included; empty\
            \ when not found or before the draft"
          items:
            $ref: "#/components/schemas/ScoutRosterPlayer"
        schedule:
          type: array
          description: "Every NHL club's game dates from today to the end of the season,\
            \ in the player pool's spelling of the club"
          items:
            $ref: "#/components/schemas/ClubGames"
        opponentWorth:
          type: array
          description: "What a game against each opponent at each venue is worth to\
            \ a player's line, so the client can weigh each of his nights rather than\
            \ count them all alike. A game against an opponent not listed is an average\
            \ night"
          items:
            $ref: "#/components/schemas/OpponentWorth"
      required:
      - found
      - opponentWorth
      - players
      - schedule
    RosteredPlayersResponse:
      type: object
      properties:
        playerIds:
          type: array
          description: "Every player on a team's roster in the league today, bench\
            \ and injured reserve included, by the player pool's id. A player the\
            \ pool has no counterpart for is left out: no row on a board can be him."
          items:
            type: integer
            format: int32
      required:
      - playerIds
    LeagueSummaryContributor:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
          format: double
          description: "What he counts for the team: his value over the games its\
            \ lineup starts him in, the `total` of his roster row"
      required:
      - name
      - value
    LeagueSummaryResponse:
      type: object
      description: "A league's teams, totalled against a projection"
      properties:
        source:
          type: string
          description: The projection the players were scored against
          enum:
          - model
          - last_season
          - projection
        modelVersion:
          type: string
          description: The model version behind the numbers; absent for last season's
            stats
        projectionId:
          type: string
          description: "The board the players were scored against; present only for\
            \ `source: projection`"
        premium:
          type: boolean
          deprecated: true
          description: "Always true: the per-player halves are filled in for everyone.\
            \ Kept for web builds that still read it."
        scoringType:
          type: string
          description: "How the league scores, which decides what the totals are:\
            \ fantasy points, or a z-score across the categories it counts"
          enum:
          - points
          - category
        status:
          type: string
          description: Where the league's draft has got to
          enum:
          - PRE_DRAFT
          - IN_PROGRESS
          - FINISHED
          - UNKNOWN
        picks:
          type: integer
          format: int32
          description: How many picks the league has made; zero before it drafts
        unprojectedPlayers:
          type: integer
          format: int32
          description: "How many of the players the teams hold have no line in the\
            \ projection and so count for nothing — a board that leaves players out,\
            \ most often a spreadsheet import"
        inSeason:
          type: boolean
          description: "Whether the model's lines are its in-season ones: each player's\
            \ rest of the season from the last nightly run, on the season line's scale,\
            \ which is what the model is ranked by once the season is under way. False\
            \ for a board and last season's stats, which are whole seasons as they\
            \ stand, and before the first game."
        categoryKeys:
          type: array
          description: "The stats the league counts, in its own order. The labels\
            \ are the client's to write."
          items:
            type: string
        positionKeys:
          type: array
          description: "The lineup slots the league starts players in, then `BN` where\
            \ the league has a bench"
          items:
            type: string
        teams:
          type: array
          description: "Teams, best total first"
          items:
            $ref: "#/components/schemas/LeagueSummaryTeam"
      required:
      - categoryKeys
      - inSeason
      - picks
      - positionKeys
      - premium
      - scoringType
      - source
      - status
      - teams
      - unprojectedPlayers
    LeagueSummaryRosterRow:
      type: object
      properties:
        playerId:
          type: integer
          format: int32
        name:
          type: string
        team:
          type: string
          description: "The NHL club he plays for, as the player pool spells it; absent\
            \ where the pool lists none"
        positions:
          type: array
          description: "The positions he is eligible at, in lineup order; G alone\
            \ for a goalie"
          items:
            type: string
        total:
          type: number
          format: double
          description: "What he counts for the team: his value over the games its\
            \ lineup starts him in"
        fullValue:
          type: number
          format: double
          description: "His value over every game he plays, as if his lineup started\
            \ him in all of them: what a player the team does not count would be worth\
            \ if it did"
        values:
          type: object
          additionalProperties:
            type: number
            format: double
          description: His raw stat per category key; null where the stat is not his
            kind
        contributions:
          type: object
          additionalProperties:
            type: number
            format: double
          description: "His share of the team's cell per category key, over the games\
            \ he starts; null likewise"
        fullContributions:
          type: object
          additionalProperties:
            type: number
            format: double
          description: "His share of the team's `fullValues` cell per category key,\
            \ over every game he plays; null likewise"
        reserveSlot:
          type: string
          description: "The injured-reserve or not-active slot he is parked in today\
            \ (IR, IR+, IR-LT, IR-NR or NA), which holds a player without taking a\
            \ roster spot; absent for a player in neither"
        counted:
          type: boolean
          description: "Whether he is among the players the team's lineup is picked\
            \ from: its best, as many as the roster holds. One who is not counts for\
            \ nothing"
      required:
      - counted
      - fullValue
      - name
      - playerId
      - positions
      - total
    LeagueSummaryTeam:
      type: object
      properties:
        teamId:
          type: string
        name:
          type: string
        mine:
          type: boolean
          description: Whether this is the signed-in manager's team
        total:
          type: number
          format: double
          description: "What the team's lineup will score: night by night over the\
            \ schedule, the players with a game fill the league's slots best first\
            \ and the rest are benched, so each player counts for the share of his\
            \ games it starts him in"
        values:
          type: object
          additionalProperties:
            type: number
            format: double
          description: The cell per category key and per lineup slot. Each set sums
            to the total.
        fullTotal:
          type: number
          format: double
          description: "What the team would score were every player it holds started\
            \ in every game he plays, the ones it does not count included: the sum\
            \ of its players' `fullValue`"
        fullValues:
          type: object
          additionalProperties:
            type: number
            format: double
          description: "The cell per category key on the `fullTotal` footing; they\
            \ sum to it. No lineup-slot cells, since a slot is what starting decides."
        roster:
          type: array
          description: "The team's players, best first by what they count for: its\
            \ current roster once the draft is over, its picks until then."
          items:
            $ref: "#/components/schemas/LeagueSummaryRosterRow"
        positionPlayers:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/LeagueSummaryContributor"
          description: "The team's best lineup per position key: who holds each slot,\
            \ one slot apiece (a dual-position player where the lineup is best with\
            \ him), and under `BN` the rest of the players the team counts, as many\
            \ as its bench holds; a player it does not count is in none."
      required:
      - fullTotal
      - fullValues
      - mine
      - name
      - teamId
      - total
      - values
    FeaturesResponse:
      type: object
      properties:
        aiProjection:
          type: boolean
          description: "Whether this environment serves the AI projection: the model's\
            \ lines and a projection or preset draft seeded from them. False means\
            \ neither is served to anyone, so a client should not offer it. It says\
            \ nothing about this account's plan: an AI projection that needs premium\
            \ is still available."
        whosHotAvailableFilter:
          type: boolean
          description: "Whether Who's hot may show only the players a linked league\
            \ has available. False means the rostered-players endpoint answers 404,\
            \ so a client should not offer it."
        restOfSeasonPreset:
          type: boolean
          description: "Whether a draft may be started from the rest of the season\
            \ (source=rest_of_season). False means it is refused, so a client should\
            \ not offer it. True still offers it only while a season is under way,\
            \ which `/projection-model/rest-of-season/status` says."
        draftAnalysis:
          type: boolean
          description: "Whether this environment serves Draft Analysis, a league's\
            \ draft graded against the model. False means its endpoint answers 404,\
            \ so a client should not offer it."
        startBench:
          type: boolean
          description: "Whether this environment serves Start/Bench, the user's lineup\
            \ for a day with the model's suggestion of who to start. False means its\
            \ endpoint answers 404, so a client should not offer it."
        playerScout:
          type: boolean
          description: "Whether this environment serves Player Scout, every player\
            \ in a league with the model's view of him now and on a chosen day. False\
            \ means its endpoints answer 404, so a client should not offer it."
        roleChanges:
          type: boolean
          description: "Whether this environment serves Role Changes. False means\
            \ its endpoint answers 404, so a client should not offer it."
      required:
      - aiProjection
      - draftAnalysis
      - playerScout
      - restOfSeasonPreset
      - roleChanges
      - startBench
      - whosHotAvailableFilter
    CredentialStatusResponse:
      type: object
      properties:
        hasCredentials:
          type: boolean
      required:
      - hasCredentials
    DraftAnalysisAlternative:
      type: object
      description: The player the model ranked highest of those still undrafted when
        a pick was made
      properties:
        playerId:
          type: integer
          format: int32
          description: "The player, by the pool's own id."
        name:
          type: string
        club:
          type: string
          description: His NHL club as the pool spells it; absent where it lists none
        positions:
          type: array
          description: "Eligible positions, C/LW/RW/D/G"
          items:
            type: string
        aiRank:
          type: integer
          format: int32
          description: "His rank in the model by value over replacement, from 1"
        positionRank:
          type: string
          description: "His rank among the players at his position, as \"D3\""
      required:
      - aiRank
      - name
      - playerId
      - positions
    DraftAnalysisPick:
      type: object
      description: "One pick of a league's draft, set against the model's ranking"
      properties:
        overall:
          type: integer
          format: int32
          description: "Overall pick number, from 1."
        round:
          type: integer
          format: int32
        teamId:
          type: string
          description: The id of the team that made the pick.
        playerId:
          type: integer
          format: int32
          description: "The player, by the pool's own id."
        name:
          type: string
          description: The player's name; absent where the pool does not carry him
        club:
          type: string
          description: His NHL club as the pool spells it; absent where it lists none
        positions:
          type: array
          description: "Eligible positions, C/LW/RW/D/G; empty where the pool does\
            \ not carry him"
          items:
            type: string
        aiRank:
          type: integer
          format: int32
          description: "His rank in the model by value over replacement under the\
            \ league's scoring and roster, from 1: his value less that of the best\
            \ player at his position nobody in the league would start. Absent without\
            \ premium, and for a player the model has no line for."
        positionRank:
          type: string
          description: "His rank by value among the players at the position he is\
            \ measured at, as \"D1\". Absent without premium, and for a player the\
            \ model has no line for."
        value:
          type: number
          format: double
          description: "His value in the model: fantasy points in a points league,\
            \ the summed z-score in a category league. Absent without premium, and\
            \ for a player the model has no line for."
        valueOverSlot:
          type: number
          format: double
          description: "His value over replacement less that of the player the model\
            \ ranks at this pick's number: what the pick gained or gave away against\
            \ taking the model's player there. Absent without premium, and for a player\
            \ the model has no line for."
        grade:
          type: string
          description: "The pick's grade. Absent without premium, and in an auction\
            \ draft."
          enum:
          - STEAL
          - GOOD
          - FAIR
          - REACH
          - BIG_REACH
          - UNRANKED
        bestAvailable:
          $ref: "#/components/schemas/DraftAnalysisAlternative"
          description: "The player the model ranked highest of those still undrafted,\
            \ where he ranked above the one taken. Absent without premium."
      required:
      - overall
      - playerId
      - positions
      - round
      - teamId
    DraftAnalysisResponse:
      type: object
      description: "A league's draft, every pick graded against the model's ranking"
      properties:
        status:
          type: string
          enum:
          - PRE_DRAFT
          - IN_PROGRESS
          - FINISHED
          - UNKNOWN
        auction:
          type: boolean
          description: "True for an auction draft, whose pick order is nomination\
            \ order: no pick is graded."
        scoringType:
          type: string
          description: "How the league scores, which is what values are in: fantasy\
            \ points or summed z-scores."
          enum:
          - points
          - category
        preseason:
          type: boolean
          description: "Whether the picks were graded against the model's line frozen\
            \ on the eve of the season (true), or its current season line where that\
            \ is not stored."
        modelVersion:
          type: string
          description: The model version the grades came from
        premium:
          type: boolean
          description: "Whether the per-pick half is filled in. False leaves every\
