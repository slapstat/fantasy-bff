plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.openapi.generator' version '7.26.0'
	id 'com.github.spotbugs' version '6.5.12'
	id 'idea'
}

group = 'com.fantasy'
// No `version`: the release version is the git tag tag-on-merge.yml derives from the PR title,
// stamped into the running app as APP_VERSION.

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Error tracking: ERROR-level logs are forwarded to Sentry (see logback-spring.xml).
	// Active only when SENTRY_DSN is set (prod/staging); inert locally and in CI/tests.
	implementation 'io.sentry:sentry-logback:8.60.0'

	// Configuration Properties Metadata
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// Google ID token verification (Nimbus JWT decoder against Google's JWKS)
	implementation 'org.springframework.security:spring-security-oauth2-jose'

	// OpenAPI / Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Static analysis: SpotBugs bug patterns + FindSecBugs security rules.
	spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
	// Forward -DupdateSpec=true to the test JVM so OpenApiSpecSnapshotTest can
	// rewrite specs/bff-openapi.yaml instead of asserting against it.
	systemProperty 'updateSpec', System.getProperty('updateSpec', 'false')
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// Only build the executable Spring Boot jar (skip the non-runnable "-plain" jar)
// so the Docker image can copy build/libs/*.jar unambiguously.
tasks.named('jar') {
	enabled = false
}

// Generate a typed client from the committed db-service OpenAPI spec.
// Re-run after updating specs/fantasy-db-service-openapi.yaml.
// We only consume the generated *model* classes (com.fantasy.bff.generated.db.model);
// the rest compiles as a self-consistent unit. The 'native' library builds on the
// JDK's java.net.http client + Jackson (no Spring), so it is unaffected by the
// Spring Framework 7 API changes that break the generator's Spring-based templates.
openApiGenerate {
	generatorName = 'java'
	library = 'native'
	// Pass a file: URI (not a raw path) so the swagger parser resolves internal
	// $refs correctly on Windows too — a bare "C:\..." path makes it read the
	// drive letter as a URI scheme and fail.
	inputSpec = file("specs/fantasy-db-service-openapi.yaml").toURI().toString()
	outputDir = "${buildDir}/generated/openapi/db-service".toString()
	modelPackage = 'com.fantasy.bff.generated.db.model'
	apiPackage = 'com.fantasy.bff.generated.db.api'
	invokerPackage = 'com.fantasy.bff.generated.db'
	generateApiTests = false
	generateModelTests = false
	generateApiDocumentation = false
	generateModelDocumentation = false
	// `settings` is renamed in Java only — the wire name is kept by the generated
	// @JsonProperty, so nothing about the HTTP contract moves. It has to be renamed because
	// the generator writes a fluent setter named after the property, `settings(...)`, and
	// Jackson reads any single-argument method beginning with "set" as a mutator: it stripped
	// the prefix and invented a property called `tings`. Springdoc then published that
	// invention in our own spec, typed by the fluent method's return type, so three schemas
	// carried a self-referencing `tings` — and, worse than the noise, an undocumented second
	// way to set `settings` on an inbound request body. Any property named `set*` would do the
	// same; today `settings` is the only one, in ProjectionData, UpdateProjectionData, DraftState and
	// SharedProjectionData. `OpenApiSpecSnapshotTest` is what would catch a new one.
	nameMappings = [settings: 'projectionSettings']
	configOptions = [
		openApiNullable: 'false',
		useJakartaEe: 'true',
		useBeanValidation: 'true',
	]
}

// inputSpec is a plain String, so Gradle tracks the URI and not the file behind it: editing a
// spec in place leaves the task UP-TO-DATE and the build then compiles happily against stale
// models. Declaring the file as a task input makes Gradle hash its contents, so a repinned spec
// actually regenerates. (This bit us once — a repin silently did nothing and the whole build,
// CI included, went green.) The three tasks below configure it inline; this one cannot, because
// `openApiGenerate { }` above configures the plugin's *extension*, which has no task inputs.
tasks.named('openApiGenerate') {
	inputs.file("specs/fantasy-db-service-openapi.yaml")
			.withPropertyName('dbServiceSpec')
			.withPathSensitivity(PathSensitivity.RELATIVE)
}

// Same pattern for the yahoo-service spec. Re-run after updating
// specs/fantasy-yahoo-service-openapi.yaml.
tasks.register('generateYahooClient', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
	generatorName = 'java'
	library = 'native'
	inputSpec = file("specs/fantasy-yahoo-service-openapi.yaml").toURI().toString()
	inputs.file("specs/fantasy-yahoo-service-openapi.yaml")
			.withPropertyName('yahooServiceSpec')
			.withPathSensitivity(PathSensitivity.RELATIVE)
	outputDir = "${buildDir}/generated/openapi/yahoo-service".toString()
	modelPackage = 'com.fantasy.bff.generated.yahoo.model'
	apiPackage = 'com.fantasy.bff.generated.yahoo.api'
	invokerPackage = 'com.fantasy.bff.generated.yahoo'
	generateApiTests = false
	generateModelTests = false
	generateApiDocumentation = false
	generateModelDocumentation = false
	configOptions = [
		openApiNullable: 'false',
		useJakartaEe: 'true',
		useBeanValidation: 'true',
	]
}

// Same pattern for the espn-service spec. Re-run after updating
// specs/fantasy-espn-service-openapi.yaml.
tasks.register('generateEspnClient', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
	generatorName = 'java'
	library = 'native'
	inputSpec = file("specs/fantasy-espn-service-openapi.yaml").toURI().toString()
	inputs.file("specs/fantasy-espn-service-openapi.yaml")
			.withPropertyName('espnServiceSpec')
			.withPathSensitivity(PathSensitivity.RELATIVE)
	outputDir = "${buildDir}/generated/openapi/espn-service".toString()
	modelPackage = 'com.fantasy.bff.generated.espn.model'
	apiPackage = 'com.fantasy.bff.generated.espn.api'
	invokerPackage = 'com.fantasy.bff.generated.espn'
	generateApiTests = false
	generateModelTests = false
	generateApiDocumentation = false
	generateModelDocumentation = false
	configOptions = [
		openApiNullable: 'false',
		useJakartaEe: 'true',
		useBeanValidation: 'true',
	]
}

// Same pattern for the projection-service spec (committed as JSON — that repo emits JSON).
// Re-run after updating specs/fantasy-projection-service-openapi.json.
tasks.register('generateProjectionClient', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
	generatorName = 'java'
	library = 'native'
	inputSpec = file("specs/fantasy-projection-service-openapi.json").toURI().toString()
	inputs.file("specs/fantasy-projection-service-openapi.json")
			.withPropertyName('projectionServiceSpec')
			.withPathSensitivity(PathSensitivity.RELATIVE)
	outputDir = "${buildDir}/generated/openapi/projection-service".toString()
	modelPackage = 'com.fantasy.bff.generated.projection.model'
	apiPackage = 'com.fantasy.bff.generated.projection.api'
	invokerPackage = 'com.fantasy.bff.generated.projection'
	generateApiTests = false
	generateModelTests = false
	generateApiDocumentation = false
	generateModelDocumentation = false
	configOptions = [
		openApiNullable: 'false',
		useJakartaEe: 'true',
		useBeanValidation: 'true',
	]
}

sourceSets {
	main {
		java {
			srcDir "${buildDir}/generated/openapi/db-service/src/main/java"
			srcDir "${buildDir}/generated/openapi/yahoo-service/src/main/java"
			srcDir "${buildDir}/generated/openapi/espn-service/src/main/java"
			srcDir "${buildDir}/generated/openapi/projection-service/src/main/java"
		}
	}
}

// Mark the generated OpenAPI clients as generated source roots so IntelliJ-based
// tooling (Qodana headless) resolves com.fantasy.bff.generated.* during analysis.
idea {
	module {
		generatedSourceDirs += file("${buildDir}/generated/openapi/db-service/src/main/java")
		generatedSourceDirs += file("${buildDir}/generated/openapi/yahoo-service/src/main/java")
		generatedSourceDirs += file("${buildDir}/generated/openapi/espn-service/src/main/java")
		generatedSourceDirs += file("${buildDir}/generated/openapi/projection-service/src/main/java")
	}
}

// Every OpenAPI client, found by type rather than listed by name. compileJava and Qodana's
// workflow both depend on this one task, so a fifth generator is picked up by both the moment
// it is registered. Qodana scanned without two of the four for a month because its workflow
// named the generators one by one and nobody added the new ones there (#228).
tasks.register('generateOpenApiClients') {
	group = 'build'
	description = 'Generates every downstream OpenAPI client from its pinned spec.'
	dependsOn tasks.withType(org.openapitools.generator.gradle.plugin.tasks.GenerateTask)
}

compileJava.dependsOn tasks.generateOpenApiClients

// Static analysis (SpotBugs + FindSecBugs). Generated OpenAPI clients and a few
// non-actionable patterns are excluded (see config/spotbugs/exclude.xml); the build
// fails on any remaining finding, so new issues must be fixed or explicitly excluded.
spotbugs {
	toolVersion = '4.10.2'
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
	excludeFilter = file('config/spotbugs/exclude.xml')
	ignoreFailures = false
}

tasks.named('spotbugsMain') {
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('spotbugsTest') {
	enabled = false
}
