# Secrets come only from the environment.
#
# Required, with no default, so a missing or blank value stops startup: JWT_SECRET,
# DB_INTERNAL_API_KEY, YAHOO_INTERNAL_API_KEY, ESPN_INTERNAL_API_KEY, PROJECTION_INTERNAL_API_KEY
# (InternalApiKeyProperties), RESEND_API_KEY (EmailProperties; only the dev profile may leave
# it blank) and FEEDBACK_GITHUB_TOKEN (FeedbackProperties; the dev profile stands in a placeholder).
#
# Optional, and allowed to be empty because the feature they belong to is off or refuses every
# request without them: PAYMENTS_MOCK_WEBHOOK_SECRET (the mock payment provider), STRIPE_API_KEY
# and STRIPE_WEBHOOK_SECRET (Stripe, when it is the provider), GOOGLE_CLIENT_SECRET (the Google
# code-flow sign-in) and FACEBOOK_APP_SECRET (Facebook sign-in).
#
# Optional and not a secret: SIGNUP_NOTIFY_EMAIL (SignupNotificationProperties), the address mailed
# each new account; unset or blank turns those mails off, with a WARN at startup.
spring:
  application:
    name: fantasy-bff
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # The profile picture is the only upload, and the app scales it down to a few tens of KB
      # before sending. The ceiling is for a request built by hand; AvatarService applies the
      # real limit (512 KB) to what it will store.
      max-file-size: 1MB
      max-request-size: 2MB

server:
  port: ${PORT:8080}

app:
  # Public base URL of the web app, used to build links in emails (e.g. the password
  # reset link). Reuses WEB_ORIGIN (also the CORS origin) so it points at the right env.
  web-base-url: ${WEB_ORIGIN:http://localhost:4200}

email:
  # Sender identity for transactional email (non-secret).
  from: ${EMAIL_FROM:SlapStat <no-reply@slapstat.com>}
  resend:
    # Resend API key. Secret and required: without it no reset or verification email goes out,
    # so a missing or blank key stops startup. Only the dev profile may leave it blank, and there
    # the links are logged instead; they carry live tokens, so that happens nowhere else.
    api-key: ${RESEND_API_KEY}
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
    timeout-ms: 5000
  # Local runs only (the dev profile turns it on): log reset and verification links when there
  # is no Resend key. Never set this on a deployed environment.
  log-links: false

# Which platform the player pool comes from: `yahoo`, which the app was built on, or `espn`,
# which took over when Yahoo stopped serving its game-wide player collection. Both serve the
# same shape, but not the same player ids — a stored projection is keyed by the ids that were
# in use when it was saved, so this flips only together with migrating those rows.
players:
  source: ${PLAYERS_SOURCE:yahoo}
  # Whether players' pictures are shown. Off unless this says otherwise: they are the platform's
  # photographs, which we hold no licence to show, so a deployment that forgets the variable must
  # not bring them back. Off, every player goes out without a headshot address, the headshot
  # endpoint answers 404 without asking the platform, and the web draws initials instead.
  avatars:
    enabled: ${PLAYER_AVATARS_ENABLED:false}
  # How long each platform's whole pool, joined to the model's ids, is held for reading a league's
  # wire (Player Scout, the Streamer Planner). The pool changes once a day, when the platform's
  # service syncs; reading and joining it per request was thousands of rows and a matching pass
  # over some two thousand players. A league's rosters and waivers are still read every time.
  league-pool-ttl-ms: ${PLAYERS_LEAGUE_POOL_TTL_MS:900000}

services:
  # Per-downstream read/connect timeouts (ms). These apply in every environment:
  # locally the services run on localhost, and on the deployed Coolify environments
  # they are co-located on the same Docker network — both respond quickly.
  # yahoo-service serves OAuth + the cached player read model (~1600 players); generous timeout.
  yahoo-fantasy:
    base-url: ${YAHOO_SERVICE_URL:http://localhost:8088}
    timeout-ms: 10000
    api-key: ${YAHOO_INTERNAL_API_KEY}
    # Which season's stat line the player reads carry, as a start year. This is what the app
    # *shows* — the reference column a projection is built against — and is a separate choice
    # from what yahoo-service is *collecting* (its SYNC_YAHOO_SEASON). For most of the year
    # they differ: we gather the season being played while the editor still reads the one that
    # finished. Move this forward only when the running season's numbers should be on screen.
    stats-season: ${YAHOO_STATS_SEASON:2025}
  # espn-service reads a user's ESPN league (public leagues need only an id; private ones
  # use the stored espn_s2 + SWID cookies). Internal-only — no OAuth callback.
  espn-fantasy:
    base-url: ${ESPN_SERVICE_URL:http://localhost:8090}
    timeout-ms: 10000
    api-key: ${ESPN_INTERNAL_API_KEY}
    # How long the ESPN stat lines used to enrich player responses are held in memory.
    # espn-service refreshes them nightly, so re-fetching per request would be pure overhead
    # on the hottest endpoint in the app.
    player-stats-ttl-ms: ${ESPN_PLAYER_STATS_TTL_MS:1800000}
    # Which season's stat line the player reads carry when espn-service is the pool source, as
    # a start year. Mirrors services.yahoo-fantasy.stats-season and must hold the same value:
    # switching the source must not change which season is on screen.
    stats-season: ${ESPN_STATS_SEASON:2025}
  # ESPN's public image CDN, read only to serve /api/v1/players/{id}/headshot when the pool
  # comes from ESPN. No key, no user data, and the only thing that varies is a player id.
  espn-images:
    base-url: ${ESPN_IMAGE_BASE_URL:https://a.espncdn.com}
    timeout-ms: 5000
  database:
    base-url: ${DATABASE_SERVICE_URL:http://localhost:8086}
    # Three seconds for the calls that carry an id and return a row. Note this is a deadline on the
    # whole exchange, body included, not a gap between bytes: when it elapses the request is
    # cancelled and the response stream closes under the reader. Before raising it, see
    # HttpDatabaseServiceClient.retryingRead — the reads that were losing to a slow moment in
    # db-service (JAVA-SPRING-BOOT-1C, 2Q, 2J) ask a second time instead, which recovers the call
    # without making a real outage slower to notice.
    timeout-ms: 3000
    # The one-off player-id remap is not an ordinary call: it reads, rewrites and writes back
    # every stored projection in a single request — on staging that is 110 projections and some
    # 164 000 player rows of jsonb. Three seconds is the right ceiling for the calls a user is
    # waiting on and far too short for this one, which timed out against a freshly restarted
    # db-service while the write was still running.
    migration-timeout-ms: ${DB_MIGRATION_TIMEOUT_MS:180000}
    # Moving a whole projection is not an ordinary call either, in either direction. The payload
    # is the entire player pool the user has been editing — some 460 rows and around half a
    # megabyte of jsonb — and db-service reads or writes all of it before the response completes.
    # Three seconds is the ceiling for calls that carry an id and return a row; it was too tight
    # here, and cut off both a save (JAVA-SPRING-BOOT-17) and a read of the same payload
    # (JAVA-SPRING-BOOT-1S, 1C) against a db-service that was merely slow rather than broken.
    # Fifteen seconds is deliberately generous for someone sitting in front of it: the cost of
    # waiting is a spinner, the cost of giving up too early is their work or their page.
    projection-timeout-ms: ${DB_PROJECTION_TIMEOUT_MS:15000}
    api-key: ${DB_INTERNAL_API_KEY}
  # projection-service serves AI-generated player projections (NHL-id-keyed, league-agnostic)
  # and the measured game-range splits behind Who's hot. Internal-only.
  projection:
    base-url: ${PROJECTION_SERVICE_URL:http://localhost:8092}
    # 10s rather than the 5s picked before the service was deployed: a split aggregates a
    # season of per-game rows and the active player list is ~1600 players, so this is the
    # same order of work as yahoo-service's read model and gets the same budget.
    timeout-ms: 10000
    api-key: ${PROJECTION_INTERNAL_API_KEY}
    # How long the NHL id → platform id mapping is held in memory. Building it reads both
    # sides in full and matches them by identity; the answer only changes when a roster does,
    # and Who's hot would otherwise rebuild it twice per page load.
    player-mapping-ttl-ms: ${PROJECTION_PLAYER_MAPPING_TTL_MS:1800000}
    # Season the model projects, as a start year: 2026 is the 2026-27 season. Game-range
    # splits default to the season before it, since that is the one with games played.
    season: ${PROJECTION_SEASON:2026}
    # Which model version to read. Empty is the normal setting and means "whichever version
    # projection-service most recently ran for the season" — a model bump then reaches users
    # when its rows land, with nothing to set by hand. Naming a version pins it, which is the
    # rollback path.
    model-version: ${PROJECTION_MODEL_VERSION:}
    # Manual NHL id → platform id pairs ("8480012:5432,8471234:9876"), for the handful of
    # players name matching cannot reach: shared name + team + jersey number, unrecognisable
    # transliterations, or an ambiguous last-name-and-initial. Non-secret, and normally empty —
    # it exists so a bad match is an env var and a restart rather than a release.
    player-id-overrides: ${PROJECTION_PLAYER_ID_OVERRIDES:}

# The AI projection: the model-seeded starting point (source=model, as a projection or as a
# preset draft) and the model lines the new-projection page previews it with. On unless this
# says otherwise, since the feature ships — a deployment that forgets the variable keeps it.
# Off refuses source=model and /api/v1/projection-model/seed, so an environment whose model is
# not worth offering does not offer one.
#
# NOTE: this leaves Who's hot alone. The game-range splits under the same path prefix are
# measured numbers rather than the model's estimates, and stay up either way. This one answer
# (AiProjectionAvailability) is what /api/v1/features reports and what the web follows, so the
# web has no switch of its own.
ai-projection:
  enabled: ${AI_PROJECTION_ENABLED:true}

# The rest of the season as a draft preset (source=rest_of_season, and
# /api/v1/projection-model/rest-of-season/status). Off unless this says otherwise, since it is new;
# off, both are refused and /api/v1/features reports restOfSeasonPreset false. It also needs the AI
# projection, whose lines it is, and premium like it.
rest-of-season-preset:
  enabled: ${REST_OF_SEASON_PRESET_ENABLED:false}

# Player Scout (/api/v1/player-scout/**): every player in a league with the model's rest of the
# season now and as it stood on a chosen day, rescaled to the games left, beside his measured ice
# since that day. The page that replaced the FA scout. Off unless this says
# otherwise, since it is new; off, its endpoints answer 404 and /api/v1/features reports
# playerScout false. It also needs the AI projection, whose lines it shows.
player-scout:
  enabled: ${PLAYER_SCOUT_ENABLED:false}

# Role Changes (GET /api/v1/role-changes): skaters whose ice or power-play role just moved, measured
# by projection-service. Off unless this says otherwise, since it is a draft; off, the endpoint
# answers 404 and /api/v1/features reports roleChanges false. Not a premium feature.
role-changes:
  enabled: ${ROLE_CHANGES_ENABLED:false}

# Draft Analysis (/api/v1/draft-analysis/**): a league's draft with every pick graded against the
# model's preseason line. Off unless this says otherwise, since it is new; off, its endpoint answers
# 404 and /api/v1/features reports draftAnalysis false. It also needs the AI projection, whose
# ranking it grades by, and reading a league's draft (league-draft-sync), where the picks come from.
draft-analysis:
  enabled: ${DRAFT_ANALYSIS_ENABLED:false}

# Start/Bench (/api/v1/start-bench/**): the user's lineup for a day with the model's line for each
# player, so the client can suggest who to start. Off unless this says otherwise, since it is new;
# off, its endpoint answers 404 and /api/v1/features reports startBench false. It also needs the AI
# projection, whose lines it sets the lineup by. Not a premium feature.
start-bench:
  enabled: ${START_BENCH_ENABLED:false}

# Who's hot narrowed to the players nobody in the user's linked league holds
# (GET /api/v1/leagues/rostered-players). Off unless this says otherwise, since it is new; off, the
# endpoint answers 404 and /api/v1/features reports whosHotAvailableFilter false. It also needs a
# pool on Yahoo ids, because a Yahoo roster names players by Yahoo's. Not a premium feature.
whos-hot:
  available-filter:
    enabled: ${WHOS_HOT_AVAILABLE_FILTER_ENABLED:false}

# Bug reports and feature requests from signed-in users (POST /api/v1/feedback), filed as issues
# in a PRIVATE GitHub repository: each carries the reporter's email address so the answer can go
# out by mail. Always served.
feedback:
  github:
    # A fine-grained token with Issues: read and write on the feedback repository and nothing
    # else. Secret and required: a missing or blank token stops startup.
    token: ${FEEDBACK_GITHUB_TOKEN}
    repository: ${FEEDBACK_GITHUB_REPOSITORY:slapstat/slapstat-feedback}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    timeout-ms: 10000
  # Mailed a link to each issue as it is filed: GitHub does not notify the token's owner of an issue
  # they opened, so without this a report sits in the repository unseen. Sent through Resend.
  notify-email: ${FEEDBACK_NOTIFY_EMAIL:info@slapstat.com}

# The owner is mailed each new account (password, Google or Facebook) with its address and sign-up
# method, through Resend. Unset or blank turns it off; the bff says so once at startup.
signup-notification:
  notify-email: ${SIGNUP_NOTIFY_EMAIL:}

payments:
  # Which provider implementation serves checkout/portal/webhooks: "mock" (in-repo test double,
  # the default) or "stripe". Selecting a provider is a config change only.
  provider: ${PAYMENTS_PROVIDER:mock}
  mock:
    # Secret the mock uses to sign its checkout/portal tokens and webhook payloads. Optional
    # (see the top of this file): the mock flow fails closed when it is unset.
    webhook-secret: ${PAYMENTS_MOCK_WEBHOOK_SECRET:}
    # Base URL the mock uses to build its stub URLs and to self-POST the webhook. Locally the
    # BFF's own origin; on Coolify the bff service's Docker network alias.
    self-base-url: ${PAYMENTS_MOCK_SELF_BASE_URL:http://localhost:8080}
  stripe:
    # One host for test and live mode; the key decides which. Overridden only by tests.
    api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
    timeout-ms: ${STRIPE_TIMEOUT_MS:10000}
    # Secret key (sk_test_... or sk_live_..., or a restricted rk_ key). Optional (see the top of
    # this file): Stripe calls fail without it.
    api-key: ${STRIPE_API_KEY:}
    # The webhook endpoint's signing secret (whsec_...), used to verify the Stripe-Signature header.
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # The recurring price a checkout subscribes to (price_...).
    price-id: ${STRIPE_PRICE_ID:}
    # Stripe as merchant of record, collecting and remitting the tax. On unless turned off, so a
    # missing variable cannot quietly make us the seller: an account Stripe has not approved for
    # Managed Payments then has its checkouts refused rather than sold without it.
    managed-payments: ${STRIPE_MANAGED_PAYMENTS:true}
    # How stale a webhook's own timestamp may be before we treat it as a replay.
    signature-tolerance-seconds: ${STRIPE_SIGNATURE_TOLERANCE_SECONDS:300}

security:
  permitted-urls:
    - "/api/v1/auth/**"
    - "/api/v1/versions"
    - "/actuator/health"
  # Comma-separated browser origins allowed to call the API (CORS). Defaults to WEB_ORIGIN,
  # which every deployed environment already sets, so a deployed instance is correctly
  # configured without an active profile. Set CORS_ALLOWED_ORIGINS to allow several (staging
  # also allows http://localhost:4200 so `npm run start:staging` works). Unset everywhere =
  # empty = no cross-origin caller is allowed, which is the safe default for a bare run.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:${WEB_ORIGIN:}}
  # Comma-separated allowlist of admin emails (e.g. ADMIN_EMAILS="me@x.com,you@y.com").
  # Logins by these addresses get an `admin` claim in their JWT (ROLE_ADMIN). Empty = no admins.
  admin-emails: ${ADMIN_EMAILS:}
  google:
    # Public OAuth Client ID for "Sign in with Google" (not a secret). When unset,
    # /api/v1/auth/google rejects all requests and the web hides the Google button.
    client-id: ${GOOGLE_CLIENT_ID:}
    # OAuth Client Secret (SECRET), used server-side to exchange the authorization code from
    # the top-level-redirect flow (/api/v1/auth/google/code). When unset that endpoint rejects
    # all requests; the embedded-button endpoint (/api/v1/auth/google) does not need it.
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Google's OAuth 2.0 token endpoint (non-secret; overridable for tests).
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    # Comma-separated allowlist of redirect URIs accepted for the code flow. Defaults to
    # <WEB_ORIGIN>/auth/google/callback so the common single-origin case needs no extra config;
    # set GOOGLE_REDIRECT_URIS to list several (e.g. apex + www) when needed. Each value must
    # also be registered as an authorized redirect URI on the Google OAuth client.
    allowed-redirect-uris: ${GOOGLE_REDIRECT_URIS:${WEB_ORIGIN:http://localhost:4200}/auth/google/callback}
  facebook:
    # Public Facebook App ID (not a secret) + the App Secret (secret), used server-side to
    # verify the user's access token via the Graph API. When either is unset,
    # /api/v1/auth/facebook rejects all requests and the web hides the Facebook button.
    app-id: ${FACEBOOK_APP_ID:}
    app-secret: ${FACEBOOK_APP_SECRET:}
    graph-base-url: ${FACEBOOK_GRAPH_BASE_URL:https://graph.facebook.com}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 2592000000  # 30 days
  refresh-cookie:
    # The refresh token also travels as the HttpOnly cookie slapstat_refresh (Path=/api/v1/auth,
    # SameSite=Lax, host-only). Secure unless turned off, which only the dev profile does: Safari
    # refuses a Secure cookie set over http://localhost.
    secure: true
  rate-limit:
    # Per-client-IP limits on the public endpoints (brute-force / reset-email abuse, and the
    # public share reads). Non-secret; disable with RATE_LIMIT_ENABLED=false. window-seconds =
    # fixed window length.
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Protected endpoints and their per-IP limits. A key is an exact path or an Ant pattern, and
    # a pattern counts every path it covers into one bucket per client. `method` defaults to POST.
    # Add or remove an endpoint here — no code change needed.
    # Keep each key in brackets ("[/api/...]"): Spring's binder strips the slashes from a bare map
    # key, and a rule whose key is no longer a path never matches (RateLimitPropertiesBindingTest).
    endpoints:
      "[/api/v1/auth/login]": { limit: 10, window-seconds: 300 }
      "[/api/v1/auth/register]": { limit: 5, window-seconds: 3600 }
      "[/api/v1/auth/google]": { limit: 20, window-seconds: 300 }
      "[/api/v1/auth/google/code]": { limit: 20, window-seconds: 300 }
      "[/api/v1/auth/facebook]": { limit: 20, window-seconds: 300 }
      "[/api/v1/auth/password/forgot]": { limit: 5, window-seconds: 900 }
      "[/api/v1/auth/password/reset]": { limit: 10, window-seconds: 900 }
      # Each of these sends mail or spends a single-use token, so a caller has no reason to repeat
      # them often. Resend is also capped per address below, since a per-IP limit alone does not
      # stop many callers aiming at one inbox.
      "[/api/v1/auth/verify/resend]": { limit: 5, window-seconds: 900 }
      "[/api/v1/auth/verify]": { limit: 20, window-seconds: 900 }
      # The web refreshes when its 15-minute access token runs out, once per open tab. Generous
      # enough for a household or an office behind one address, tight enough that a stolen or
      # guessed token cannot be tried at speed.
      "[/api/v1/auth/refresh]": { limit: 60, window-seconds: 300 }
      # Signing out only clears this browser's cookie; nobody needs it more than now and then.
      "[/api/v1/auth/logout]": { limit: 30, window-seconds: 300 }
      "[/api/v1/billing/checkout-session]": { limit: 10, window-seconds: 300 }
      "[/api/v1/billing/portal-session]": { limit: 10, window-seconds: 300 }
      # The public share reads. The JSON one is per real visitor IP, so it can be tight — a
      # person opening shared links does not need more than this.
      # Claiming names is worth slowing down: the namespace is first-come, first-served.
      "[/api/v1/account/username]": { limit: 10, window-seconds: 300, method: PUT }
      # A picture is a write of half a megabyte at most; nobody changes theirs this often.
      "[/api/v1/account/avatar]": { limit: 20, window-seconds: 300, method: PUT }
      # Each one opens an issue that someone has to read. Nobody reports six bugs an hour.
      "[/api/v1/feedback]": { limit: 5, window-seconds: 3600 }
      "[/api/v1/shared/*]": { limit: 60, window-seconds: 60, method: GET }
      # The crawler-facing pair is different: nginx proxies both, so every request arrives with
      # the web container as the last forwarded hop and they all share ONE bucket regardless of
      # who posted the link. These limits are therefore a ceiling on total load, not a per-caller
      # limit, and are set high enough that a link doing the rounds cannot starve everyone else's
      # previews. The card render is the expensive half, hence the tighter number.
      "[/api/v1/shared/*/preview]": { limit: 600, window-seconds: 60, method: GET }
      "[/api/v1/shared/*/og-image.png]": { limit: 300, window-seconds: 60, method: GET }
      # Public, and each uncached answer probes four services (VersionService caches it briefly).
      # The promotion workflows poll it every 15 seconds, well inside this.
      "[/api/v1/versions]": { limit: 30, window-seconds: 60, method: GET }
    # Account emails one address can be sent, per kind (verification, password reset), however
    # many callers ask. Over the cap the request is answered as usual and no mail goes out.
    emails-per-address: { limit: 3, window-seconds: 3600 }

# Swagger UI / OpenAPI docs are off unless SWAGGER_ENABLED=true, so any deployment is
# hardened by default rather than by virtue of running a particular profile. The dev profile
# turns them back on for local work; staging sets SWAGGER_ENABLED=true for QA.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # Readiness is part of /actuator/health, the one path the container health check curls.
  # DownstreamKeyVerifier sets it to REFUSING_TRAFFIC when a downstream rejects our internal key,
  # which makes that check fail and rolls a deploy back instead of serving 502s.
  health:
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: fantasy-bff
    version: ${APP_VERSION:dev}
